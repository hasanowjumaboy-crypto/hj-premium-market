
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HJ PREMIUM MARKET</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101114;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #191b20;
  padding: 25px 15px;
  text-align: center;
  border-bottom: 1px solid #b99a51;
}
h1 { color: #d6b15e; }
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}
.product {
  background: #202329;
  padding: 18px;
  border-radius: 12px;
}
.product h3 { color: #d6b15e; }
button {
  background: #d6b15e;
  color: #111;
  border: none;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  width: 100%;
}
#cart {
  background: #191b20;
  padding: 18px;
  margin-top: 25px;
  border-radius: 12px;
}
</style>
</head>
<body>
<header>
<h1>HJ PREMIUM MARKET</h1>
<p>Премиальный магазин</p>
</header>
<main class="container">
<h2>Каталог товаров</h2>
<div class="products" id="products">Загрузка товаров...</div>
<section id="cart">
<h2>Корзина</h2>
<div id="cartItems">Корзина пуста</div>
<p id="total">Итого: 0 ₽</p>
<button onclick="checkout()">Оформить заказ</button>
</section>
</main>
<script>
let cart = [];

async function loadProducts() {
  try {
    const response = await fetch('/api/products');
    const products = await response.json();
    const container = document.getElementById('products');
    container.innerHTML = '';

    products.forEach(product => {
      const card = document.createElement('div');
      card.className = 'product';

      const name = document.createElement('h3');
      name.textContent = product.name;

      const description = document.createElement('p');
      description.textContent = product.description;

      const price = document.createElement('p');
      price.textContent = product.price + ' ₽';

      const button = document.createElement('button');
      button.textContent = 'В корзину';
      button.onclick = () => addToCart(product);

      card.append(name, description, price, button);
      container.appendChild(card);
    });
  } catch (error) {
    document.getElementById('products').textContent =
      'Не удалось загрузить товары';
  }
}

function addToCart(product) {
  cart.push(product);
  renderCart();
}

function renderCart() {
  const container = document.getElementById('cartItems');
  container.innerHTML = '';
  let total = 0;

  cart.forEach(item => {
    const row = document.createElement('p');
    row.textContent = item.name + ' — ' + item.price + ' ₽';
    container.appendChild(row);
    total += Number(item.price);
  });

  if (cart.length === 0) {
    container.textContent = 'Корзина пуста';
  }

  document.getElementById('total').textContent =
    'Итого: ' + total + ' ₽';
}

async function checkout() {
  if (cart.length === 0) {
    alert('Добавьте товары в корзину');
    return;
  }

  const customer = prompt('Ваше имя:');
  if (!customer) return;

  const phone = prompt('Ваш номер телефона:');
  if (!phone) return;

  try {
    const response = await fetch('/api/orders', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({customer, phone, items: cart})
    });

    if (response.ok) {
      alert('Заказ принят!');
      cart = [];
      renderCart();
    } else {
      alert('Ошибка оформления заказа');
    }
  } catch (error) {
    alert('Ошибка соединения с сервером');
  }
}

loadProducts();
</script>
</body>
</html>
