name: Build HJ PREMIUM MARKET APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HJ-PREMIUM-MARKET-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to shop downloads
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/HJ-PREMIUM-MARKET.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/HJ-PREMIUM-MARKET.apk
          if git diff --cached --quiet; then
            echo "APK is already up to date"
          else
            git commit -m "Publish HJ PREMIUM MARKET Android APK"
            git push origin HEAD:main
          fi
