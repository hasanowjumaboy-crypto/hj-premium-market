name: Build HJ PREMIUM MARKET APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

# Serialize releases so two builds cannot overwrite the published APK out of order.
concurrency:
  group: hj-premium-market-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.p12
          keytool -list -keystore android/app/release-keystore.p12 -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Increment Android release version
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          code = re.search(r'versionCode\s+(\d+)', s)
          name = re.search(r"versionName\s+'(\d+)\.(\d+)\.(\d+)'", s)
          if not code or not name:
              raise SystemExit('Android versionCode/versionName not found')
          s = re.sub(r'versionCode\s+\d+', 'versionCode ' + str(int(code.group(1)) + 1), s, count=1)
          next_name = name.group(1) + '.' + name.group(2) + '.' + str(int(name.group(3)) + 1)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '" + next_name + "'", s, count=1)
          p.write_text(s)
          print('Building Android ' + next_name + ' (versionCode ' + str(int(code.group(1)) + 1) + ')')
          PY

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace -p android :app:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: HJ-PREMIUM-MARKET-Android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to shop downloads
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/release/app-release.apk downloads/HJ-PREMIUM-MARKET.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/build.gradle downloads/HJ-PREMIUM-MARKET.apk
          if git diff --cached --quiet; then
            echo "APK is already up to date"
          else
            git fetch origin main
            # Avoid rebasing binary APK changes; rebase the worktree onto the latest main instead.
            git reset --mixed origin/main
            git add downloads/HJ-PREMIUM-MARKET.apk
            if git diff --cached --quiet; then
              echo "APK is already up to date on main"
            else
              git -c user.name="github-actions[bot]" -c user.email="41898282+users.noreply.github.com" commit -m "Release signed HJ PREMIUM MARKET Android APK [skip ci]"
              git push origin HEAD:main
            fi
          fi
