plugins {
    id 'com.android.application'
}

def releaseStoreFile = rootProject.file("app/release-keystore.p12")

android {
    namespace 'com.hj.premiummarket'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hj.premiummarket'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }

    signingConfigs {
        release {
            storeFile releaseStoreFile
            storeType 'PKCS12'
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'hj-premium-market'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
