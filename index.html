rder:1px solid #e8edf3;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;min-height:calc(100dvh - 125px)}.wb-admin-conversation-head{display:flex;align-items:center;gap:10px;padding:11px;background:#fff;border-bottom:1px solid #e7ebf0}.wb-admin-back,.wb-admin-refresh{width:36px;height:36px;flex:0 0 36px;border:0;border-radius:10px;background:#f1f4f8;color:#34435b;font-size:24px}.wb-admin-customer-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.wb-admin-customer-title b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wb-admin-customer-title span{font-size:11px;color:#7b8795}.wb-admin-avatar-placeholder{font-size:15px}.wb-admin-customer-details{background:#fff;border-bottom:1px solid #e7ebf0;padding:9px 13px;font-size:11px;color:#536176}.wb-admin-customer-details summary{cursor:pointer;font-weight:700}.wb-admin-customer-details div{padding-top:7px}.wb-admin-customer-details p{margin:4px 0}.wb-admin-chat-messages{flex:1;min-height:260px;max-height:calc(100dvh - 310px);overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:9px;padding:13px 10px;scroll-behavior:auto;touch-action:pan-y;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}.wb-admin-message{max-width:88%;padding:9px 11px 7px;border:1px solid #e7ebf0;border-radius:13px;background:#fff;box-shadow:0 1px 2px #1c2b4208;overflow-wrap:anywhere}.wb-admin-incoming{align-self:flex-start;border-bottom-left-radius:4px}.wb-admin-outgoing{align-self:flex-end;background:#eaf2ff;border-color:#dbe7f8;border-bottom-right-radius:4px}.wb-admin-message-author{font-size:10px;font-weight:800;color:#52637b;margin-bottom:4px}.wb-admin-message-text{font-size:13px;white-space:pre-wrap;line-height:1.45}.wb-admin-message time{display:block;text-align:right;font-size:9px;color:#8b95a3;margin-top:6px}.wb-admin-message-photo{display:inline-block;width:88px;height:88px;max-width:88px;max-height:88px;object-fit:cover;border-radius:8px;margin:3px 3px 0 0;cursor:zoom-in;background:#e8edf3}.wb-admin-chat-empty{text-align:center;color:#8b95a3;font-size:12px;padding:35px 12px}.wb-admin-composer{display:flex;align-items:flex-end;gap:7px;padding:10px;background:#fff;border-top:1px solid #e7ebf0;position:sticky;bottom:0}.wb-admin-composer textarea{flex:1;min-width:0;min-height:42px;max-height:110px;margin:0;border-radius:12px;background:#f5f7fa;border-color:#e6eaf0;font-size:13px;resize:vertical}.wb-admin-composer .chat-attach{width:42px;height:42px;flex:0 0 42px;border-radius:11px;background:#f0f3f7;color:#52637b}.wb-admin-send{height:42px;min-width:44px;border:0;border-radius:11px;background:#263a59;color:#fff;font-size:19px;font-weight:800}@media(max-width:600px){.wb-admin-conversation{min-height:calc(100dvh - 110px);margin:-4px -4px 0}.wb-admin-chat-messages{max-height:calc(100dvh - 280px);min-height:230px}.wb-admin-message{max-width:92%}}

/* Unread counts and two-sided chat read receipts */
.hj-nav-unread{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 5px;margin-left:6px;border-radius:20px;background:#e53935;color:#fff;font-size:10px;font-weight:800;line-height:17px;vertical-align:middle}.wb-admin-unread{background:#e53935!important;color:#fff!important;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;border-radius:20px;font-size:10px;font-weight:800}.wb-message-time,.wb-admin-message time{font-size:10px}.wb-message-time{color:#7d8795}.wb-from-customer .wb-message-time{color:#6e7c91}

.wb-msg-actions{display:none;gap:7px;flex-wrap:wrap;margin:7px 0 2px;padding:8px;background:#fff;border:1px solid #e5e9ef;border-radius:11px}.wb-msg-actions.open{display:flex}.wb-msg-actions button{border:0;border-radius:8px;padding:7px 10px;background:#f1f3f6;color:#293345;font-size:12px}.wb-msg-actions button.danger{background:#fee8e8;color:#b4232d}.wb-select-toolbar{display:none;align-items:center;justify-content:space-between;padding:9px 12px;background:#eef3fb;border-radius:10px;margin:8px 0}.wb-select-toolbar.open{display:flex}.wb-msg-check{display:none;margin-right:8px;accent-color:#111827}.wb-select-mode .wb-msg-check{display:inline-block}.wb-admin-message,.wb-message{position:relative;cursor:pointer}.wb-swipe-row{position:relative;display:block;overflow:hidden;border-radius:10px;margin:4px 0;background:transparent;touch-action:pan-y}.wb-swipe-row .wb-admin-chat-card{position:relative;z-index:1;display:flex;width:100%;min-width:0;gap:8px;align-items:center;padding:7px 9px;margin:0;border:1px solid #e8edf3;border-radius:10px;background:#fff;box-shadow:none;transition:transform .18s ease;touch-action:pan-y}.wb-swipe-row .wb-chat-delete{position:absolute;z-index:3;right:0;top:0;bottom:0;width:0;padding:0;overflow:hidden;opacity:0;pointer-events:none;border:0;border-radius:0 10px 10px 0;background:#dc3545;color:#fff;font-size:11px;font-weight:700;transition:width .18s ease,opacity .18s ease}.wb-swipe-row.swiped .wb-admin-chat-card{transform:translateX(-76px);width:calc(100% + 76px)}.wb-swipe-row.swiped .wb-chat-delete{width:76px;opacity:1;pointer-events:auto}.wb-admin-chat-list{padding:7px}.wb-admin-chat-list-head{margin-bottom:8px}.wb-admin-chat-avatar{width:34px;height:34px;flex:0 0 34px;font-size:12px}.wb-admin-chat-card-main{gap:0}.wb-admin-chat-card-top b{font-size:11px;line-height:1.2}.wb-admin-chat-card-top time{font-size:9px}.wb-admin-chat-card-subject{font-size:10px;margin-top:1px;line-height:1.2}.wb-admin-chat-card-last{font-size:10px;margin-top:2px;line-height:1.25}.wb-admin-chat-card-meta{font-size:9px;margin-top:2px;line-height:1.2}.wb-admin-unread{font-size:9px;min-width:17px;height:17px;padding:2px 5px}

.wb-chat-page>.wb-chat-head,.wb-chat-page>.wb-chat-topic,.wb-chat-page>.wb-chat-note,.wb-chat-page>#customerTyping,.wb-chat-page>#customerChatPreview,.wb-chat-page>.wb-chat-composer{flex-shrink:0}

<body>
<div id="root"><div class="loading">Загрузка магазина…</div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const state={config:{currency:'сомони'},products:[],homeOrder:[],categories:[],cart:{},selected:new Set(),selectedSizes:{},view:'home',category:'all',search:'',saleIndex:0,saleSlide:0,saleSwipeAt:0,profile:null,profileEditing:false,orders:[],reviews:[],refreshingHome:false,adminToken:sessionStorage.getItem('hj_admin_token')||'',adminTab:'stats',adminData:{},profileChatOpen:false,customerChatOrderContext:null,adminChatUid:'',aiMessages:[]};
try{const saved=JSON.parse(localStorage.getItem('hj_market_cart')||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved)){state.cart=saved;state.selected=new Set(Object.keys(saved))}}catch{}
function deviceId(){let v=localStorage.getItem('hj_device_id');if(!/^[a-f0-9]{32}$/.test(v||'')){const a=new Uint8Array(16);crypto.getRandomValues(a);v=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('hj_device_id',v)}return v}
const telegram=()=>window.Telegram?.WebApp?.initData||'';
function headers(customer=false,admin=false){const h={};if(customer){h['x-device-id']=deviceId();if(telegram())h['x-tg-init-data']=telegram()}if(admin&&state.adminToken)h.Authorization='Bearer '+state.adminToken;return h}
async function api(url,opts={},kind='public'){const h={...headers(kind==='customer',kind==='admin'),...(opts.headers||{})};if(opts.body&&typeof opts.body==='string')h['Content-Type']='application/json';const res=await fetch(url,{...opts,headers:h});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||data.message||('Ошибка '+res.status));return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)+' '+(state.config.currency||'сомони')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2800)}
function img(src,alt=''){return src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:'<span>✦</span>'}
function cartQty(id){return Number(state.cart[id]||0)}
function saveCart(){localStorage.setItem('hj_market_cart',JSON.stringify(state.cart))}
function changeQty(id,delta){const p=state.products.find(x=>String(x.id)===String(id));if(!p)return;const key=String(id);const next=Math.max(0,Math.min(Number(p.stock),cartQty(key)+delta));if(next){state.cart[key]=next;state.selected.add(key)}else{delete state.cart[key];state.selected.delete(key)}saveCart();render()}
function cartCount(){return Object.values(state.cart).reduce((a,b)=>a+Number(b||0),0)}
function priceMarkup(p, quantity=1, large=false){const discounted=Number(p.discountPercent)>0&&Number(p.regularPrice)>Number(p.price);const current=money(Number(p.price)*quantity);if(!discounted)return `<span class="${large?'sale-current-large':''}">${current}</span>`;return `<span class="sale-prices ${large?'sale-prices-large':''}"><span class="sale-old">${money(Number(p.regularPrice)*quantity)}</span><span class="sale-current">${current}</span><span class="sale-badge">СКИДКА −${Number(p.discountPercent)}%</span></span>`}
function productCard(p){const q=cartQty(p.id);return `<article class="product"><button type="button" class="photo" data-open-product="${esc(p.id)}" aria-label="Открыть ${esc(p.name)}">${img(p.image,p.name)}${Number(p.discountPercent)>0?'<span class="product-sale-badge">СКИДКА −'+Number(p.discountPercent)+'%</span>':''}</button><div class="pbody"><button type="button" class="pname" data-open-product="${esc(p.id)}" style="border:0;background:none;padding:0;text-align:left;width:100%">${esc(p.name)}</button><div class="desc">${esc(p.desc||'')}</div><div class="rating">★ ${Number(p.rating||0).toFixed(1)} · ${Number(p.reviews||0)} отзывов</div><div class="price">${priceMarkup(p)}</div><div class="stock">${Number(p.stock)>0?'В наличии: '+p.stock:'Нет в наличии'}</div>${p.sizes?.length?`<label class="fieldlabel" style="display:block;margin-top:8px">Размер кольца</label><select class="field" data-size="${esc(p.id)}"><option value="">Выберите размер</option>${p.sizes.map(z=>`<option value="${esc(z)}" ${state.selectedSizes[p.id]===z?'selected':''}>${esc(z)}</option>`).join('')}</select>`:''}<div style="margin-top:9px">${q?`<div class="qty"><button data-minus="${esc(p.id)}">−</button><span>${q}</span><button data-plus="${esc(p.id)}">+</button></div>`:`<button class="addbtn" data-add="${esc(p.id)}" ${Number(p.stock)<=0?'disabled':''}>В корзину</button>`}</div><button class="secondary" style="width:100%;margin-top:7px;font-size:11px" data-reviews="${esc(p.id)}">Отзывы и оценка</button></div></article>`}
function nav(){return `<div class="bottom"><nav class="nav"><button data-view="home" class="${state.view==='home'?'active':''}"><b>⌂</b>Главная</button><button data-view="catalog" class="${state.view==='catalog'?'active':''}"><b>▦</b>Каталог</button><button data-view="cart" class="${state.view==='cart'?'active':''}"><b>🛒</b>Корзина ${cartCount()?`<span class="count">${cartCount()}</span>`:''}</button><button data-view="profile" class="${state.view==='profile'?'active':''}"><b>♙</b>Профиль</button></nav></div>`}
function header(){return `<header class="top"><div class="brandline"><div><div class="brand">HJ PREMIUM MARKET</div><div class="premium">КАЧЕСТВО · СТИЛЬ · ПРЕМИУМ</div></div><div style="font-size:27px;color:#e8c78b">✦</div></div><p>Добро пожаловать! Выбирайте товары и оформляйте заказ онлайн.</p><div class="searchbox"><input id="search" placeholder="Найти товар…" value="${esc(state.search)}"><button id="searchBtn">Найти</button></div></header>`}
function categoryIcon(name){const n=String(name||'').toLocaleLowerCase('ru');if(n.includes('парф')||n.includes('дух'))return '🧴';if(n.includes('рем'))return '🧷';if(n.includes('час'))return '⌚';if(n.includes('кольц'))return '💍';if(n.includes('обув'))return '👞';if(n.includes('сум'))return '👜';return '✦'}
function catalogView(){return `<section class="panel"><div class="sectionhead"><div><h2 style="margin:0">Каталог</h2><div class="muted">Выберите категорию товаров</div></div></div><div class="category-grid"><button class="category-tile" data-open-category="all"><span class="category-icon">🛍️</span><span>Все товары</span><small>${state.products.length} товаров</small></button>${state.categories.map(cat=>{const count=state.products.filter(p=>String(p.categoryId)===String(cat.id)).length;return `<button class="category-tile" data-open-category="${esc(cat.id)}"><span class="category-icon">${categoryIcon(cat.name)}</span><span>${esc(cat.name)}</span><small>${count} товаров</small></button>`}).join('')}</div></section>`}
function categoryView(){const cat=state.categories.find(x=>String(x.id)===String(state.category));const list=filteredProducts();return `<section class="panel"><div class="sectionhead"><button class="secondary" data-view="catalog">← Категории</button><span class="muted">${list.length} товаров</span></div><h2>${state.category==='all'?'Все товары':categoryIcon(cat?.name)+' '+esc(cat?.name||'Категория')}</h2><div class="products">${list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">В этой категории пока нет товаров</div>'}</div></section>`}
function discountedProducts(){return state.products.filter(p=>Number(p.discountPercent)>0&&Number(p.regularPrice)>Number(p.price)&&Number(p.stock)>0)}
function saleBanner(){const items=discountedProducts();if(!items.length)return '';const slides=Array.from({length:4},(_,i)=>{const p=items[i%items.length];const variants=[['СКИДКА ДНЯ','Особая цена только в HJ PREMIUM MARKET'],['ПОРАДУЙ СЕБЯ','Премиум-покупки стали выгоднее'],['ВЫГОДНО СЕЙЧАС','Выбирай любимые товары по особой цене'],['НЕ УПУСТИ','Твоя выгодная покупка уже здесь']];const v=variants[i];return `<button type="button" class="sale-hero sale-hero-v${i}" data-open-sale aria-label="Открыть все товары со скидкой"><span class="sale-hero-copy"><span class="sale-hero-kicker">HJ PREMIUM MARKET · СПЕЦИАЛЬНОЕ ПРЕДЛОЖЕНИЕ</span><strong class="sale-hero-title">${v[0]}<br><em>−${Number(p.discountPercent)}%</em></strong><span class="sale-hero-product">${esc(p.name)}</span><span class="sale-hero-reason">Повод: ${esc(p.discountReason||'Специальное предложение')}</span><span class="sale-hero-cta">СМОТРЕТЬ ВСЕ СКИДКИ　›</span></span><span class="sale-hero-image">${p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'<span>✦</span>'}<span class="sale-hero-sticker">СКИДКА</span></span><span class="sale-hero-shine"></span></button>`}).join('');return `<div class="sale-carousel" data-sale-carousel><div class="sale-carousel-track" style="transform:translateX(-${state.saleSlide*100}%)">${slides}</div><div class="sale-carousel-controls"><button type="button" class="sale-arrow" data-sale-prev aria-label="Предыдущий баннер">‹</button><div class="sale-carousel-dots">${[0,1,2,3].map(i=>'<button type="button" data-sale-dot="'+i+'" class="'+(i===state.saleSlide?'active':'')+'" aria-label="Баннер '+(i+1)+'"></button>').join('')}</div><button type="button" class="sale-arrow" data-sale-next aria-label="Следующий баннер">›</button></div></div>`}
function updateSaleBanner(){state.saleSlide=(state.saleSlide+1)%4;const holder=$('[data-sale-banner]');if(holder){holder.innerHTML=saleBanner();bindSaleCarousel()}}
function saleView(){const list=discountedProducts();return `<section class="panel"><div class="sectionhead"><button class="secondary" data-view="home">← На главную</button><span class="muted">${list.length} товаров</span></div><h2>🔥 Все товары со скидкой</h2><p class="muted" style="margin:-6px 0 14px">Специальные цены действуют на товары ниже</p><div class="products">${list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">Сейчас товаров со скидкой нет</div>'}</div></section>`}
function homeView(){let list=filteredProducts();return `${header()}<div class="section sale-banner-wrap" data-sale-banner>${saleBanner()}</div><section class="section"><div class="sectionhead"><h2>${state.search?'Результаты поиска':'Все товары'}</h2><span class="muted">${list.length} товаров</span></div><div class="products">${list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">Товары не найдены</div>'}</div></section>`}
function cartView(){const entries=Object.entries(state.cart).filter(([id,q])=>q>0&&state.products.some(p=>String(p.id)===String(id)));if(!entries.length)return `<section class="panel"><h2>Корзина</h2><div class="empty">В корзине пока пусто.<br><button class="primary dark" style="margin-top:14px" data-view="catalog">Перейти в каталог</button></div></section>`;const total=entries.reduce((s,[id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return s+(p?Number(p.price)*q:0)},0);const selectedTotal=entries.reduce((s,[id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return s+(p&&state.selected.has(id)?Number(p.price)*q:0)},0);return `<section class="panel"><div class="sectionhead"><h2>Корзина</h2><label><input type="checkbox" id="selectAll" ${entries.every(([id])=>state.selected.has(id))?'checked':''}> Выбрать всё</label></div>${entries.map(([id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return `<div class="cartrow"><input type="checkbox" data-select="${esc(id)}" ${state.selected.has(id)?'checked':''}><div>${img(p.image,p.name)}</div><div><div class="cartname">${esc(p.name)}</div><div class="cartprice">${priceMarkup(p,q)}</div><div class="cartcontrols"><button data-minus="${esc(id)}">−</button><b>${q}</b><button data-plus="${esc(id)}">+</button><button class="secondary" data-remove="${esc(id)}" style="margin-left:auto">Убрать</button></div></div></div>`}).join('')}<div class="totalbar"><div class="totalrow"><span>Выбрано к оплате</span><span>${money(selectedTotal)}</span></div><div class="notice">Всего в корзине: ${money(total)}. Неотмеченные товары останутся в корзине.</div><button class="primary dark" id="checkout" style="width:100%" ${selectedTotal<=0?'disabled':''}>Оформить выбранные товары</button></div></section>`}
function profileView(){
 const p=state.profile||{},fullName=[p.firstName,p.lastName].filter(Boolean).join(' ')||'Ваш профиль';
