<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>HJ PREMIUM MARKET</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#151923;--muted:#777f8d;--line:#e8eaf0;--accent:#171d2b;--gold:#c69a4b;--red:#e34c58;--green:#198754;--shadow:0 8px 26px #1720330c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:86px;overscroll-behavior-y:contain}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;overscroll-behavior-y:contain;touch-action:pan-y}.top{background:linear-gradient(135deg,#101827,#293348);color:#fff;padding:22px 16px 18px;border-radius:0 0 24px 24px}.brandline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:900;letter-spacing:1.3px}.premium{font-size:10px;color:#e9c98d;letter-spacing:3px;margin-top:3px}.top p{color:#d4d8e0;margin:13px 0 0;font-size:13px}.searchbox{display:flex;gap:8px;margin-top:17px}.searchbox input{flex:1;min-width:0;border:0;border-radius:13px;padding:13px 14px;background:#fff;color:#111}.searchbox button,.primary{border:0;border-radius:12px;background:var(--gold);color:#171717;font-weight:800;padding:12px 16px}.section{padding:18px 14px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sectionhead h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:12px}.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;color:#343b49}.cat.active{background:#171d2b;color:#fff;border-color:#171d2b}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.category-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.category-tile{min-height:112px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:var(--shadow);color:var(--ink);font-weight:800}.category-icon{font-size:30px;line-height:1}.category-tile small{font-size:11px;color:var(--muted);font-weight:500}.product{background:#fff;border:1px solid #eef0f4;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);min-width:0}.photo{width:100%;padding:0;border:0;cursor:pointer;height:158px;background:linear-gradient(135deg,#e9eaf0,#f8f8fa);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#a0a5af;font-size:34px}.photo img{width:100%;height:100%;object-fit:cover}.pbody{padding:11px} .pname{font-weight:750;cursor:pointer;font-size:14px;line-height:1.3;min-height:36px}.desc{font-size:11px;color:var(--muted);margin:5px 0;min-height:29px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rating{font-size:11px;color:#9a742e;margin:6px 0}.price{font-size:17px;font-weight:900;margin:6px 0 9px}.stock{font-size:10px;color:var(--muted)}.addbtn{width:100%;border:0;border-radius:10px;background:#171d2b;color:#fff;padding:10px;font-weight:700}.qty{display:flex;align-items:center;justify-content:space-between;background:#f0f1f5;border-radius:10px;padding:4px}.qty button{width:34px;height:32px;border:0;border-radius:8px;background:#fff;font-size:20px}.qty span{font-weight:800}.empty{text-align:center;background:#fff;padding:30px 16px;border-radius:16px;color:var(--muted)}.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{border:0;background:transparent;color:#818896;padding:5px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav button b{font-size:20px;font-weight:500}.nav button.active{color:#151b29;font-weight:800}.count{background:var(--red);color:white;border-radius:20px;font-size:9px;padding:1px 5px;margin-left:3px}.panel{padding:18px 14px}.panel h2{margin:0 0 14px;font-size:20px}.cartrow{display:grid;grid-template-columns:20px 68px 1fr;gap:9px;align-items:center;background:#fff;padding:10px;border-radius:13px;margin-bottom:9px}.cartrow img{width:68px;height:68px;object-fit:cover;border-radius:9px}.cartname{font-weight:700;font-size:13px}.cartprice{font-weight:800;margin-top:4px}.cartcontrols{display:flex;align-items:center;gap:7px;margin-top:6px}.cartcontrols button{border:0;background:#f0f1f5;border-radius:7px;width:27px;height:26px}.totalbar{position:sticky;bottom:75px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:14px;box-shadow:var(--shadow)}.totalrow{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin-bottom:10px}.field{display:block;width:100%;border:1px solid #dfe2e9;border-radius:11px;padding:12px;background:#fff;margin:7px 0 12px;color:#171923}.fieldlabel{font-size:12px;font-weight:700;color:#515968}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}.profilebox,.orderbox,.adminbox,.reviewbox{background:#fff;border-radius:15px;padding:14px;margin-bottom:11px;border:1px solid var(--line)}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#eee}.notice{font-size:12px;color:var(--muted);margin:8px 0}.primary.dark{background:#171d2b;color:#fff}.danger{background:#fff0f1;color:#bf3542;border:1px solid #ffd6da}.secondary{background:#f0f1f5;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.modalback{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;align-items:stretch;justify-content:stretch;padding:0}.modal{background:#fff;border-radius:0;width:100%!important;height:100%;max-height:100vh!important;overflow-y:auto;padding:18px!important;overscroll-behavior:contain}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.close{border:0;background:#f0f1f5;border-radius:50%;width:34px;height:34px;font-size:19px}.stars button{border:0;background:none;font-size:27px;color:#d4d6dc;padding:2px}.stars button.on{color:#d6a64f}.hidden{display:none!important}.adminwrap{max-width:760px;margin:auto;padding:16px}.adminheader{background:#171d2b;color:white;border-radius:17px;padding:18px;margin-bottom:14px}.adminheader h1{font-size:20px;margin:0}.adminnav{display:flex;gap:7px;overflow:auto;margin:12px 0}.adminnav button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px}.adminnav button.active{background:#171d2b;color:#fff}.adminstats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#fff;border-radius:13px;padding:14px}.adminstats .stat{border:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer;box-shadow:0 2px 10px #1720330a}.stat strong{font-size:22px;display:block}.adminitem{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}.adminitem h3{margin:0 0 5px;font-size:15px}.adminitem p{margin:4px 0;font-size:12px;color:#626a77}.adminitem .field{margin:7px 0}.adminitem img{width:58px;height:58px;object-fit:cover;border-radius:8px;float:right}.toast{position:fixed;z-index:50;bottom:90px;left:50%;transform:translateX(-50%);background:#171d2b;color:white;padding:11px 16px;border-radius:12px;max-width:90%;box-shadow:var(--shadow);font-size:13px}.loading{text-align:center;padding:35px;color:var(--muted)}
@media(min-width:600px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:190px}.top{margin-top:14px}.bottom{border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<div id="root"><div class="loading">Загрузка магазина…</div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const state={config:{currency:'сомони'},products:[],homeOrder:[],categories:[],cart:{},selected:new Set(),selectedSizes:{},view:'home',category:'all',search:'',profile:null,orders:[],reviews:[],refreshingHome:false,adminToken:sessionStorage.getItem('hj_admin_token')||'',adminTab:'stats',adminData:{}};
try{const saved=JSON.parse(localStorage.getItem('hj_market_cart')||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved)){state.cart=saved;state.selected=new Set(Object.keys(saved))}}catch{}
function deviceId(){let v=localStorage.getItem('hj_device_id');if(!/^[a-f0-9]{32}$/.test(v||'')){const a=new Uint8Array(16);crypto.getRandomValues(a);v=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('hj_device_id',v)}return v}
const telegram=()=>window.Telegram?.WebApp?.initData||'';
function headers(customer=false,admin=false){const h={};if(customer){h['x-device-id']=deviceId();if(telegram())h['x-tg-init-data']=telegram()}if(admin&&state.adminToken)h.Authorization='Bearer '+state.adminToken;return h}
async function api(url,opts={},kind='public'){const h={...headers(kind==='customer',kind==='admin'),...(opts.headers||{})};if(opts.body&&typeof opts.body==='string')h['Content-Type']='application/json';const res=await fetch(url,{...opts,headers:h});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||data.message||('Ошибка '+res.status));return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)+' '+(state.config.currency||'сомони')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2800)}
function img(src,alt=''){return src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:'<span>✦</span>'}
function cartQty(id){return Number(state.cart[id]||0)}
function saveCart(){localStorage.setItem('hj_market_cart',JSON.stringify(state.cart))}
function changeQty(id,delta){const p=state.products.find(x=>String(x.id)===String(id));if(!p)return;const key=String(id);const next=Math.max(0,Math.min(Number(p.stock),cartQty(key)+delta));if(next){state.cart[key]=next;state.selected.add(key)}else{delete state.cart[key];state.selected.delete(key)}saveCart();render()}
function cartCount(){return Object.values(state.cart).reduce((a,b)=>a+Number(b||0),0)}
function productCard(p){const q=cartQty(p.id);return `<article class="product"><button type="button" class="photo" data-open-product="${esc(p.id)}" aria-label="Открыть ${esc(p.name)}">${img(p.image,p.name)}</button><div class="pbody"><button type="button" class="pname" data-open-product="${esc(p.id)}" style="border:0;background:none;padding:0;text-align:left;width:100%">${esc(p.name)}</button><div class="desc">${esc(p.desc||'')}</div><div class="rating">★ ${Number(p.rating||0).toFixed(1)} · ${Number(p.reviews||0)} отзывов</div><div class="price">${money(p.price)}</div><div class="stock">${Number(p.stock)>0?'В наличии: '+p.stock:'Нет в наличии'}</div>${p.sizes?.length?`<label class="fieldlabel" style="display:block;margin-top:8px">Размер кольца</label><select class="field" data-size="${esc(p.id)}"><option value="">Выберите размер</option>${p.sizes.map(z=>`<option value="${esc(z)}" ${state.selectedSizes[p.id]===z?'selected':''}>${esc(z)}</option>`).join('')}</select>`:''}<div style="margin-top:9px">${q?`<div class="qty"><button data-minus="${esc(p.id)}">−</button><span>${q}</span><button data-plus="${esc(p.id)}">+</button></div>`:`<button class="addbtn" data-add="${esc(p.id)}" ${Number(p.stock)<=0?'disabled':''}>В корзину</button>`}</div><button class="secondary" style="width:100%;margin-top:7px;font-size:11px" data-reviews="${esc(p.id)}">Отзывы и оценка</button></div></article>`}
function nav(){return `<div class="bottom"><nav class="nav"><button data-view="home" class="${state.view==='home'?'active':''}"><b>⌂</b>Главная</button><button data-view="catalog" class="${state.view==='catalog'?'active':''}"><b>▦</b>Каталог</button><button data-view="cart" class="${state.view==='cart'?'active':''}"><b>🛒</b>Корзина ${cartCount()?`<span class="count">${cartCount()}</span>`:''}</button><button data-view="profile" class="${state.view==='profile'?'active':''}"><b>♙</b>Профиль</button></nav></div>`}
function header(){return `<header class="top"><div class="brandline"><div><div class="brand">HJ PREMIUM MARKET</div><div class="premium">КАЧЕСТВО · СТИЛЬ · ПРЕМИУМ</div></div><div style="font-size:27px;color:#e8c78b">✦</div></div><p>Добро пожаловать! Выбирайте товары и оформляйте заказ онлайн.</p><div class="searchbox"><input id="search" placeholder="Найти товар…" value="${esc(state.search)}"><button id="searchBtn">Найти</button></div></header>`}
function categoryIcon(name){const n=String(name||'').toLocaleLowerCase('ru');if(n.includes('парф')||n.includes('дух'))return '🧴';if(n.includes('рем'))return '🧷';if(n.includes('час'))return '⌚';if(n.includes('кольц'))return '💍';if(n.includes('обув'))return '👞';if(n.includes('сум'))return '👜';return '✦'}
function catalogView(){return `<section class="panel"><div class="sectionhead"><div><h2 style="margin:0">Каталог</h2><div class="muted">Выберите категорию товаров</div></div></div><div class="category-grid"><button class="category-tile" data-open-category="all"><span class="category-icon">🛍️</span><span>Все товары</span><small>${state.products.length} товаров</small></button>${state.categories.map(cat=>{const count=state.products.filter(p=>String(p.categoryId)===String(cat.id)).length;return `<button class="category-tile" data-open-category="${esc(cat.id)}"><span class="category-icon">${categoryIcon(cat.name)}</span><span>${esc(cat.name)}</span><small>${count} товаров</small></button>`}).join('')}</div></section>`}
function categoryView(){const cat=state.categories.find(x=>String(x.id)===String(state.category));const list=filteredProducts();return `<section class="panel"><div class="sectionhead"><button class="secondary" data-view="catalog">← Категории</button><span class="muted">${list.length} товаров</span></div><h2>${state.category==='all'?'Все товары':categoryIcon(cat?.name)+' '+esc(cat?.name||'Категория')}</h2><div class="products">${list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">В этой категории пока нет товаров</div>'}</div></section>`}
function homeView(){let list=filteredProducts();return `${header()}<section class="section"><div class="sectionhead"><h2>${state.search?'Результаты поиска':'Все товары'}</h2><span class="muted">${list.length} товаров</span></div><div class="products">${list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">Товары не найдены</div>'}</div></section>`}
function cartView(){const entries=Object.entries(state.cart).filter(([id,q])=>q>0&&state.products.some(p=>String(p.id)===String(id)));if(!entries.length)return `<section class="panel"><h2>Корзина</h2><div class="empty">В корзине пока пусто.<br><button class="primary dark" style="margin-top:14px" data-view="catalog">Перейти в каталог</button></div></section>`;const total=entries.reduce((s,[id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return s+(p?Number(p.price)*q:0)},0);const selectedTotal=entries.reduce((s,[id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return s+(p&&state.selected.has(id)?Number(p.price)*q:0)},0);return `<section class="panel"><div class="sectionhead"><h2>Корзина</h2><label><input type="checkbox" id="selectAll" ${entries.every(([id])=>state.selected.has(id))?'checked':''}> Выбрать всё</label></div>${entries.map(([id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return `<div class="cartrow"><input type="checkbox" data-select="${esc(id)}" ${state.selected.has(id)?'checked':''}><div>${img(p.image,p.name)}</div><div><div class="cartname">${esc(p.name)}</div><div class="cartprice">${money(p.price* q)}</div><div class="cartcontrols"><button data-minus="${esc(id)}">−</button><b>${q}</b><button data-plus="${esc(id)}">+</button><button class="secondary" data-remove="${esc(id)}" style="margin-left:auto">Убрать</button></div></div></div>`}).join('')}<div class="totalbar"><div class="totalrow"><span>Выбрано к оплате</span><span>${money(selectedTotal)}</span></div><div class="notice">Всего в корзине: ${money(total)}. Неотмеченные товары останутся в корзине.</div><button class="primary dark" id="checkout" style="width:100%" ${selectedTotal<=0?'disabled':''}>Оформить выбранные товары</button></div></section>`}
function profileView(){const p=state.profile||{};return `<section class="panel"><h2>Профиль покупателя</h2><div class="profilebox"><div style="display:flex;align-items:center;gap:13px">${p.photo?`<img class="avatar" src="${esc(p.photo)}">`:'<div class="avatar" style="display:grid;place-items:center;font-size:30px">♙</div>'}<div><b>${esc([p.firstName,p.lastName].filter(Boolean).join(' ')||'Ваш профиль')}</b><div class="muted">Ваши данные нужны для оформления заказа</div></div></div><form id="profileForm"><div class="formgrid"><label class="wide"><span class="fieldlabel">Имя *</span><input class="field" name="firstName" required value="${esc(p.firstName||'')}" placeholder="Имя"></label><label><span class="fieldlabel">Фамилия</span><input class="field" name="lastName" value="${esc(p.lastName||'')}" placeholder="Фамилия"></label><label><span class="fieldlabel">Отчество</span><input class="field" name="middleName" value="${esc(p.middleName||'')}" placeholder="Отчество"></label><label class="wide"><span class="fieldlabel">Телефон *</span><input class="field" name="phone" required value="${esc(p.phone||'')}" placeholder="+992…" type="tel"></label><label><span class="fieldlabel">Пол *</span><select class="field" name="gender" required><option value="">Выберите</option><option value="Мужской" ${p.gender==='Мужской'?'selected':''}>Мужской</option><option value="Женский" ${p.gender==='Женский'?'selected':''}>Женский</option></select></label><label><span class="fieldlabel">Возраст *</span><input class="field" name="age" type="number" min="1" max="120" step="1" required value="${esc(p.age||'')}" placeholder="Ваш возраст"></label><label class="wide"><span class="fieldlabel">Адрес доставки *</span><textarea class="field" name="address" required rows="2" placeholder="Город, улица, дом">${esc(p.address||'')}</textarea></label><label class="wide"><span class="fieldlabel">Фото профиля (необязательно)</span><input class="field" type="file" name="photoFile" accept="image/png,image/jpeg,image/webp"></label></div><button class="primary dark" style="width:100%">Сохранить профиль</button></form><p class="notice">Ваши телефон и адрес не показываются другим покупателям. Они доступны владельцу магазина только для обработки заказа.</p></div><div class="sectionhead"><h2>Мои заказы</h2></div><div id="myOrders"><div class="loading">Загрузка заказов…</div></div></section>`}
function render(){const root=$('#root');if(location.pathname==='/admin'){renderAdmin();return}let content=state.view==='cart'?cartView():state.view==='profile'?profileView():state.view==='catalog'?catalogView():state.view==='category'?categoryView():homeView();root.innerHTML=`<div class="app">${content}</div>${nav()}`;bindCommon();if(state.view==='profile')loadMyOrders()}
function bindCommon(){
 const root=$('#root');
 root.onclick=async e=>{
  const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;if(state.view==='home'){state.category='all';state.search='';}render();if(state.view==='profile')loadProfile();return}
  const openCat=e.target.closest('[data-open-category]');if(openCat){state.category=openCat.dataset.openCategory;state.search='';state.view='category';render();return}
  const cat=e.target.closest('[data-cat]');if(cat){state.category=cat.dataset.cat;state.view='category';render();return}
  const add=e.target.closest('[data-add]');if(add){const p=state.products.find(x=>String(x.id)===String(add.dataset.add));if(!p)return;if(p.sizes?.length&&!state.selectedSizes[p.id]){toast('Сначала выберите размер кольца');return}changeQty(p.id,1);return}
  const plus=e.target.closest('[data-plus]');if(plus){changeQty(plus.dataset.plus,1);return}
  const minus=e.target.closest('[data-minus]');if(minus){changeQty(minus.dataset.minus,-1);return}
  const remove=e.target.closest('[data-remove]');if(remove){delete state.cart[remove.dataset.remove];state.selected.delete(remove.dataset.remove);saveCart();render();return}
  const open=e.target.closest('[data-open-product]');if(open){openProduct(open.dataset.openProduct);return}
  const orderProduct=e.target.closest('[data-order-product]');if(orderProduct){openOrderedProduct(orderProduct.dataset.orderProduct);return}
  const reviews=e.target.closest('[data-reviews]');if(reviews){openReviews(reviews.dataset.reviews);return}
  if(e.target.closest('#searchBtn')){const input=$('#search');state.search=input?input.value.trim():state.search;state.view='home';render();return}
  if(e.target.closest('#checkout')){checkout();return}
 };
 root.oninput=e=>{
  if(e.target.id!=='search')return;
  state.search=e.target.value;
  const list=filteredProducts();
  const grid=$('.products',root);if(grid)grid.innerHTML=list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">По вашему запросу ничего не найдено</div>';
  const count=$('.sectionhead .muted',root);if(count)count.textContent=list.length+' товаров';
 };
 root.onchange=e=>{
  const size=e.target.closest('[data-size]');if(size){state.selectedSizes[size.dataset.size]=size.value;return}
  const select=e.target.closest('[data-select]');if(select){select.checked?state.selected.add(select.dataset.select):state.selected.delete(select.dataset.select);render();return}

async function setupAdminPasskey(){try{if(!window.PublicKeyCredential||!navigator.credentials?.create)throw Error('Этот браузер не поддерживает биометрический вход. Откройте магазин в Chrome на Android.');const options=await adminApi('/passkey/register/options',{method:'POST',body:JSON.stringify({})});options.challenge=base64urlToBuffer(options.challenge);options.user.id=base64urlToBuffer(options.user.id);options.excludeCredentials=(options.excludeCredentials||[]).map(x=>({...x,id:base64urlToBuffer(x.id)}));const credential=await navigator.credentials.create({publicKey:options});if(!credential)throw Error('Настройка отменена');await adminApi('/passkey/register/verify',{method:'POST',body:JSON.stringify({response:credentialToJSON(credential)})});toast('Вход по отпечатку настроен');renderAdmin()}catch(e){toast(e.message||'Не удалось настроить биометрию')}}
