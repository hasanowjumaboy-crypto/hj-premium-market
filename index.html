</style>
</head>
<body>
<div id="root"><div class="loading">Загрузка магазина…</div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const state={config:{currency:'TJS'},products:[],homeOrder:[],categories:[],cart:{},selected:new Set(),selectedSizes:{},view:'home',category:'all',search:'',saleIndex:0,saleSlide:0,saleSwipeAt:0,profile:null,profileEditing:false,orders:[],reviews:[],refreshingHome:false,adminToken:sessionStorage.getItem('hj_admin_token')||'',adminTab:'stats',adminData:{},profileChatOpen:false,customerChatOrderContext:null,adminChatUid:'',aiMessages:[]};
function deviceId(){let v=localStorage.getItem('hj_device_id');if(!/^[a-f0-9]{32}$/.test(v||'')){const a=new Uint8Array(16);crypto.getRandomValues(a);v=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('hj_device_id',v)}return v}
const telegram=()=>window.Telegram?.WebApp?.initData||'';
function referralCode(){let saved=localStorage.getItem('hj_referral_code')||'';const incoming=new URLSearchParams(location.search).get('ref')||'';if(!saved&&/^[A-Za-z0-9]{8,20}$/.test(incoming)){saved=incoming.toUpperCase();localStorage.setItem('hj_referral_code',saved)}return saved}
function headers(customer=false,admin=false){const h={};if(customer){h['x-device-id']=deviceId();if(telegram())h['x-tg-init-data']=telegram();else if(referralCode())h['x-referral-code']=referralCode()}if(admin&&state.adminToken)h.Authorization='Bearer '+state.adminToken;return h}
async function api(url,opts={},kind='public'){const h={...headers(kind==='customer',kind==='admin'),...(opts.headers||{})};if(opts.body&&typeof opts.body==='string')h['Content-Type']='application/json';const res=await fetch(url,{...opts,headers:h});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||data.message||('Ошибка '+res.status));return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){const raw=String(state.config.currency||'TJS').trim();const currency=/^(сомони|сомон|tjs|с\.?)$/i.test(raw)?'TJS':raw;return new Intl.NumberFormat('ru-RU').format(Number(v)||0)+' '+currency}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2800)}
function showShopShareOptions(url,text){const u=encodeURIComponent(url),title=encodeURIComponent('HJ Premium Market'),enc=encodeURIComponent(text+' '+url);const old=document.getElementById('hjShareOptions');if(old)old.remove();const modal=document.createElement('div');modal.id='hjShareOptions';modal.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.48);display:flex;align-items:flex-end;justify-content:center;padding:14px';modal.innerHTML='<div style="width:100%;max-width:440px;background:var(--card,#fff);color:var(--text,#222);border-radius:18px;padding:18px;box-shadow:0 8px 40px #0003"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b style="font-size:16px">Поделиться магазином</b><button type="button" data-share-close style="border:0;background:transparent;font-size:24px;padding:0 5px">×</button></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px"><a href="#" data-wa-share="1" style="padding:13px 10px;border-radius:11px;background:#e8f7ed;color:#16833b;text-decoration:none;text-align:center;font-weight:700">WhatsApp</a><a href="https://t.me/share/url?url='+u+'&text='+encodeURIComponent(text)+'" target="_blank" rel="noopener" style="padding:13px 10px;border-radius:11px;background:#e8f3fb;color:#1683c4;text-decoration:none;text-align:center;font-weight:700">Telegram</a><a href="sms:?body='+enc+'" style="padding:13px 10px;border-radius:11px;background:#f1f2f4;color:inherit;text-decoration:none;text-align:center;font-weight:700">SMS</a><a href="mailto:?subject='+title+'&body='+enc+'" style="padding:13px 10px;border-radius:11px;background:#f1f2f4;color:inherit;text-decoration:none;text-align:center;font-weight:700">Эл. почта</a></div><button type="button" data-share-copy style="width:100%;margin-top:10px;padding:12px;border:1px solid #ddd;border-radius:11px;background:transparent;color:inherit;font-weight:600">Скопировать ссылку</button></div>';modal.addEventListener('click',async e=>{const wa=e.target.closest('[data-wa-share]');if(wa){e.preventDefault();const bridge=location.origin+'/open-whatsapp?text='+encodeURIComponent(text+' '+url);const tg=window.Telegram?.WebApp;if(tg?.openLink){tg.openLink(bridge)}else{window.open(bridge,'_blank')}return}if(e.target===modal||e.target.closest('[data-share-close]')){modal.remove();return}if(e.target.closest('[data-share-copy]')){try{await navigator.clipboard.writeText(url);toast('Ссылка скопирована');modal.remove()}catch{toast('Не удалось скопировать ссылку')}}});document.body.appendChild(modal)}
function img(src,alt=''){return src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:'<span>✦</span>'}
function cartQty(id){return Number(state.cart[id]||0)}
async function saveCart(){try{await api('/api/cart',{method:'PUT',body:JSON.stringify({items:state.cart,selected:[...state.selected],sizes:state.selectedSizes})},'customer')}catch(e){toast('Не удалось сохранить корзину: '+e.message)}}
async function loadCart(){const data=await api('/api/cart',{},'customer');state.cart=data.items||{};state.selected=new Set(data.selected||Object.keys(state.cart));state.selectedSizes=data.sizes||{};render()}
function changeQty(id,delta){const p=state.products.find(x=>String(x.id)===String(id));if(!p)return;const key=String(id);const next=Math.max(0,Math.min(Number(p.stock),cartQty(key)+delta));if(next){state.cart[key]=next;state.selected.add(key)}else{delete state.cart[key];state.selected.delete(key);delete state.selectedSizes[key]}saveCart();render()}
function cartCount(){return Object.values(state.cart).reduce((a,b)=>a+Number(b||0),0)}
function priceMarkup(p, quantity=1, large=false){const discounted=Number(p.discountPercent)>0&&Number(p.regularPrice)>Number(p.price);const current=money(Number(p.price)*quantity);if(!discounted)return `<span class="${large?'sale-current-large':''}">${current}</span>`;return `<span class="sale-prices ${large?'sale-prices-large':''}"><span class="sale-old">${money(Number(p.regularPrice)*quantity)}</span><span class="sale-current">${current}</span><span class="sale-badge">СКИДКА −${Number(p.discountPercent)}%</span></span>`}

const DEFAULT_CHARACTERISTIC_FIELDS=["Артикул","Бренд","Модель","Цвет","Материал","Размер","Объём","Вес","Ширина","Длина","Страна производства","Комплектация"];
function characteristicFieldsMarkup(values={}){
 const data=values&&typeof values==='object'&&!Array.isArray(values)?values:{};
 const known=DEFAULT_CHARACTERISTIC_FIELDS.map(key=>({key,value:data[key]||''}));
 const custom=Object.entries(data).filter(([key])=>!DEFAULT_CHARACTERISTIC_FIELDS.includes(key));
 return `<div class="characteristic-fields"><div class="muted" style="margin:0 0 8px">Заполняйте только подходящие параметры — пустые автоматически не попадут в магазин.</div><div class="formgrid">${known.map(({key,value})=>`<label><span class="fieldlabel">${esc(key)}</span><input class="field" data-char-key="${esc(key)}" value="${esc(value)}" placeholder="${esc(key)}"></label>`).join('')}</div><div data-custom-char-list>${custom.map(([key,value])=>characteristicCustomRow(key,value)).join('')}</div><button type="button" class="secondary" data-add-characteristic style="width:100%;margin-top:8px">＋ Добавить свою характеристику</button></div>`;
}
function characteristicCustomRow(key='',value=''){
 return `<div class="formgrid" data-custom-char-row style="align-items:end"><label><span class="fieldlabel">Название характеристики</span><input class="field" data-char-key value="${esc(key)}" placeholder="Например, Тип застёжки"></label><label><span class="fieldlabel">Значение</span><div style="display:flex;gap:6px;align-items:center"><input class="field" data-char-value value="${esc(value)}" placeholder="Значение" style="margin-bottom:12px;min-width:0"><button type="button" class="secondary danger" data-remove-characteristic aria-label="Удалить" style="height:42px;flex:0 0 42px;padding:0;margin-bottom:12px">×</button></div></label></div>`;
}
function bindCharacteristicFields(form){
 const list=form.querySelector('[data-custom-char-list]');
 form.querySelector('[data-add-characteristic]')?.addEventListener('click',()=>{list.insertAdjacentHTML('beforeend',characteristicCustomRow());list.lastElementChild?.querySelector('[data-char-key]')?.focus()});
 list?.addEventListener('click',event=>{const remove=event.target.closest('[data-remove-characteristic]');if(remove)remove.closest('[data-custom-char-row]')?.remove()});
}
function collectCharacteristics(form){
 const result={};
 form.querySelectorAll('[data-char-key]').forEach(keyInput=>{
  const row=keyInput.closest('[data-custom-char-row]');
  const key=String(row?keyInput.value:keyInput.dataset.charKey||'').trim();
  const value=String((row?row.querySelector('[data-char-value]'):keyInput)?.value||'').trim();
  if(key&&value)result[key]=value;
 });
 return result;
}

function parseCharacteristics(value){const result={};String(value||'').split(String.fromCharCode(10)).forEach(line=>{const i=line.indexOf(':');if(i<1)return;const key=line.slice(0,i).trim(),val=line.slice(i+1).trim();if(key&&val)result[key]=val});return result}
function productCard(p){
 const photos=[...new Set((Array.isArray(p.photos)&&p.photos.length?p.photos:[p.image]).filter(Boolean))],first=photos[0]||'',q=cartQty(p.id);
 return `<article class="product" data-open-product="${esc(p.id)}"><div class="card-gallery" data-card-gallery="${esc(p.id)}" data-open-product="${esc(p.id)}">
 ${first?`<img class="card-gallery-image" src="${esc(first)}" alt="${esc(p.name)}" loading="lazy">`:'<div class="card-gallery-empty">✦</div>'}
 ${Number(p.discountPercent)>0?`<span class="product-sale-badge">−${Number(p.discountPercent)}%</span>`:''}
 ${photos.length>1?`<div class="card-photo-dots">${photos.map((_,i)=>`<button type="button" class="card-photo-dot ${i===0?'active':''}" data-card-dot="${i}" aria-label="Фото ${i+1}"></button>`).join('')}</div>`:''}
  <div class="product-cart-float">${q?`<div class="qty card-qty"><button type="button" data-minus="${esc(p.id)}">−</button><span>${q}</span><button type="button" data-plus="${esc(p.id)}">+</button></div>`:`<button type="button" class="addbtn product-cart-icon" data-add="${esc(p.id)}" aria-label="Добавить в корзину" title="Добавить в корзину" ${Number(p.stock)<=0?'disabled':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18l-2 10H5L3 10Z"/><path d="m8 10 4-6 4 6M8 14v3M12 14v3M16 14v3"/></svg></button>`}</div>
 </div><div class="pbody"><div class="price">${priceMarkup(p)}</div><button type="button" class="pname" data-open-product="${esc(p.id)}">${esc(p.name)}</button><button type="button" class="rating-count" data-reviews="${esc(p.id)}">${Number(p.reviews||0)} оценок</button></div>
</article>`;
}
function nav(){return `<div class="bottom"><nav class="nav"><button data-view="home" class="${state.view==='home'?'active':''}"><b>⌂</b>Главная</button><button data-view="catalog" class="${state.view==='catalog'?'active':''}"><b>▦</b>Каталог</button><button data-view="cart" class="${state.view==='cart'?'active':''}"><b>🛒</b>Корзина ${cartCount()?`<span class="count">${cartCount()}</span>`:''}</button><button data-view="profile" class="${state.view==='profile'?'active':''}"><b>♙</b>Профиль</button></nav></div>`}
function header(){return `<header class="top"><div class="brandline"><div><div class="brand">HJ PREMIUM MARKET</div><div class="premium">КАЧЕСТВО · СТИЛЬ · ПРЕМИУМ</div></div><div style="font-size:27px;color:#e8c78b">✦</div></div><p>Добро пожаловать! Выбирайте товары и оформляйте заказ онлайн.</p><div class="searchbox"><input id="search" placeholder="Найти товар…" value="${esc(state.search)}"><button id="searchBtn">Найти</button></div></header>`}
function categoryIcon(name){const n=String(name||'').toLocaleLowerCase('ru');if(n.includes('скид'))return '🔥';if(n.includes('парф')||n.includes('дух'))return '🧴';if(n.includes('рем'))return '🧷';if(n.includes('час'))return '⌚';if(n.includes('кольц'))return '💍';if(n.includes('обув'))return '👞';if(n.includes('сум'))return '👜';return '✦'}
function categoryImage(name){const n=String(name||'').toLocaleLowerCase('ru-RU');if(n.includes('парф')||n.includes('дух'))return 'https://images.unsplash.com/photo-1584841247175-4d766cefa018?auto=format&fit=crop&w=700&q=80';if(n.includes('рем'))return 'https://images.unsplash.com/photo-1565251419287-9097aa7299ec?auto=format&fit=crop&w=700&q=80';if(n.includes('час'))return 'https://images.unsplash.com/photo-1772638904164-eed7c6b1e57e?auto=format&fit=crop&w=700&q=80';if(n.includes('кольц'))return 'https://images.unsplash.com/photo-1635767798595-a1d2c9deacb4?auto=format&fit=crop&w=700&q=80';return 'https://images.unsplash.com/photo-1584841247175-4d766cefa018?auto=format&fit=crop&w=700&q=80'}
function catalogTile(name,id,isAll=false,isSale=false){if(isSale)return `<button class="category-tile category-tile-sale" data-open-category="${esc(id)}"><span class="category-sale-art"><b>ДО</b><strong>−90%</strong></span><span class="category-label">${esc(name)}</span></button>`;if(isAll)return `<button class="category-tile" data-open-category="${esc(id)}"><span class="category-art category-art-all"><img src="https://images.unsplash.com/photo-1584841247175-4d766cefa018?auto=format&fit=crop&w=500&q=75" alt=""><img src="https://images.unsplash.com/photo-1565251419287-9097aa7299ec?auto=format&fit=crop&w=500&q=75" alt=""><img src="https://images.unsplash.com/photo-1772638904164-eed7c6b1e57e?auto=format&fit=crop&w=500&q=75" alt=""></span><span class="category-label">${esc(name)}</span></button>`;const image=categoryImage(name);return `<button class="category-tile" data-open-category="${esc(id)}"><span class="category-art" style="background-image:url('${image}')"></span><span class="category-label">${esc(name)}</span></button>`}
function catalogView(){return `<section class="panel"><div class="sectionhead"><div><h2 style="margin:0">Каталог</h2><div class="muted">Выберите категорию товаров</div></div></div><div class="category-grid">${catalogTile('Все товары','all',true,false)}${state.categories.map(cat=>{const isSale=String(cat.name||'').trim().toLocaleLowerCase('ru-RU')==='скидки';return catalogTile(cat.name,cat.id,false,isSale)}).join('')}</div></section>`}
function categoryView(){const cat=state.categories.find(x=>String(x.id)===String(state.category));const list=filteredProducts();return `<section class="panel"><div class="sectionhead"><button class="secondary" data-view="catalog">← Категории</button><span class="muted">${list.length} товаров</span></div><h2>${state.category==='all'?'Все товары':categoryIcon(cat?.name)+' '+esc(cat?.name||'Категория')}</h2><div class="products">${list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">В этой категории пока нет товаров</div>'}</div></section>`}
function discountedProducts(){return state.products.filter(p=>Number(p.discountPercent)>0&&Number(p.regularPrice)>Number(p.price)&&Number(p.stock)>0)}
function saleBanner(){const items=discountedProducts();if(!items.length)return '';const slides=Array.from({length:4},(_,i)=>{const p=items[i%items.length];const variants=[['СКИДКА ДНЯ','Особая цена только в HJ PREMIUM MARKET'],['ПОРАДУЙ СЕБЯ','Премиум-покупки стали выгоднее'],['ВЫГОДНО СЕЙЧАС','Выбирай любимые товары по особой цене'],['НЕ УПУСТИ','Твоя выгодная покупка уже здесь']];const v=variants[i];return `<button type="button" class="sale-hero sale-hero-v${i}" data-open-sale aria-label="Открыть все товары со скидкой"><span class="sale-hero-copy"><span class="sale-hero-kicker">HJ PREMIUM MARKET · СПЕЦИАЛЬНОЕ ПРЕДЛОЖЕНИЕ</span><strong class="sale-hero-title">${v[0]}<br><em>−${Number(p.discountPercent)}%</em></strong><span class="sale-hero-product">${esc(p.name)}</span><span class="sale-hero-reason">Повод: ${esc(p.discountReason||'Специальное предложение')}</span><span class="sale-hero-cta">СМОТРЕТЬ ВСЕ СКИДКИ　›</span></span><span class="sale-hero-image">${p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'<span>✦</span>'}<span class="sale-hero-sticker">СКИДКА</span></span><span class="sale-hero-shine"></span></button>`}).join('');return `<div class="sale-carousel" data-sale-carousel><div class="sale-carousel-track" style="transform:translateX(-${state.saleSlide*100}%)">${slides}</div><div class="sale-carousel-controls"><button type="button" class="sale-arrow" data-sale-prev aria-label="Предыдущий баннер">‹</button><div class="sale-carousel-dots">${[0,1,2,3].map(i=>'<button type="button" data-sale-dot="'+i+'" class="'+(i===state.saleSlide?'active':'')+'" aria-label="Баннер '+(i+1)+'"></button>').join('')}</div><button type="button" class="sale-arrow" data-sale-next aria-label="Следующий баннер">›</button></div></div>`}
function updateSaleBanner(){state.saleSlide=(state.saleSlide+1)%4;const holder=$('[data-sale-banner]');if(holder){holder.innerHTML=saleBanner();bindSaleCarousel()}}
function saleView(){const list=discountedProducts();return `<section class="panel"><div class="sectionhead"><button class="secondary" data-view="home">← На главную</button><span class="muted">${list.length} товаров</span></div><h2>🔥 Все товары со скидкой</h2><p class="muted" style="margin:-6px 0 14px">Специальные цены действуют на товары ниже</p><div class="products">${list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">Сейчас товаров со скидкой нет</div>'}</div></section>`}
function homeView(){let list=filteredProducts();return `${header()}<div class="section sale-banner-wrap" data-sale-banner>${saleBanner()}</div><section class="section"><div class="sectionhead"><h2>${state.search?'Результаты поиска':'Все товары'}</h2></div><div class="products">${list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">Товары не найдены</div>'}</div></section>`}
function cartView(){const entries=Object.entries(state.cart).filter(([id,q])=>q>0&&state.products.some(p=>String(p.id)===String(id)));if(!entries.length)return `<section class="panel"><h2>Корзина</h2><div class="empty">В корзине пока пусто.<br><button class="primary dark" style="margin-top:14px" data-view="catalog">Перейти в каталог</button></div></section>`;const total=entries.reduce((s,[id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return s+(p?Number(p.price)*q:0)},0);const selectedTotal=entries.reduce((s,[id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return s+(p&&state.selected.has(id)?Number(p.price)*q:0)},0);return `<section class="panel"><div class="sectionhead"><h2>Корзина</h2><label><input type="checkbox" id="selectAll" ${entries.every(([id])=>state.selected.has(id))?'checked':''}> Выбрать всё</label></div>${entries.map(([id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return `<div class="cartrow"><input type="checkbox" data-select="${esc(id)}" ${state.selected.has(id)?'checked':''}><div>${img(p.image,p.name)}</div><div><div class="cartname">${esc(p.name)}</div><div class="cartprice">${priceMarkup(p,q)}</div><div class="cartcontrols"><button data-minus="${esc(id)}">−</button><b>${q}</b><button data-plus="${esc(id)}">+</button><button class="secondary" data-remove="${esc(id)}" style="margin-left:auto">Убрать</button></div></div></div>`}).join('')}</section>`}
function profileView(){
 const p=state.profile||{},fullName=[p.firstName,p.lastName].filter(Boolean).join(' ')||'Ваш профиль';

button><input id="customerChatImage" type="file" name="image" accept="image/jpeg,image/png,image/webp" multiple style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></form></section>`;
 if(state.profileEditing)return `<section class="panel"><div style="display:flex;align-items:center;gap:10px;margin-bottom:16px"><button type="button" class="secondary" id="profileBack">← Назад</button><h2 style="margin:0">Мои данные</h2></div><div class="profilebox"><form id="profileForm"><div class="formgrid"><label class="wide"><span class="fieldlabel">Имя *</span><input class="field" name="firstName" required value="${esc(p.firstName||'')}" placeholder="Имя"></label><label><span class="fieldlabel">Фамилия</span><input class="field" name="lastName" value="${esc(p.lastName||'')}" placeholder="Фамилия"></label><label><span class="fieldlabel">Отчество</span><input class="field" name="middleName" value="${esc(p.middleName||'')}" placeholder="Отчество"></label><label class="wide"><span class="fieldlabel">Телефон *</span><input class="field" name="phone" required value="${esc(p.phone||'')}" placeholder="+992…" type="tel"></label><label><span class="fieldlabel">Пол *</span><select class="field" name="gender" required><option value="">Выберите</option><option value="Мужской" ${p.gender==='Мужской'?'selected':''}>Мужской</option><option value="Женский" ${p.gender==='Женский'?'selected':''}>Женский</option></select></label><label><span class="fieldlabel">Возраст *</span><input class="field" name="age" type="number" min="1" max="120" step="1" required value="${esc(p.age||'')}" placeholder="Ваш возраст"></label><label class="wide"><span class="fieldlabel">Адрес доставки *</span><textarea class="field" name="address" required rows="2" placeholder="Город, улица, дом">${esc(p.address||'')}</textarea></label><label class="wide"><span class="fieldlabel">Изменить фото профиля</span><input class="field" type="file" name="photoFile" accept="image/png,image/jpeg,image/webp"></label></div><button class="primary dark" style="width:100%">Сохранить изменения</button></form><p class="notice">Ваши телефон и адрес не видны другим покупателям.</p></div></section>`;
 return `<section class="panel profile-panel"><h2>Профиль покупателя</h2>
 <div class="profilebox" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap">
  <div style="display:flex;align-items:center;gap:11px;min-width:0;flex:1">${p.photo?`<img class="avatar" src="${esc(p.photo)}" alt="Фото профиля">`:'<div class="avatar" style="display:grid;place-items:center;font-size:30px">♙</div>'}
   <div style="min-width:0"><b style="font-size:15px;display:block;overflow-wrap:anywhere">${esc(fullName)}</b><div class="muted" style="margin-top:5px">${esc(p.phone||'Покупатель')}</div></div>
  </div>
  <button type="button" class="secondary" id="profileData" style="flex:0 0 auto;white-space:nowrap;font-size:13px;padding:10px 12px">Мои данные　›</button>
 </div>
 <div style="margin:10px 0 12px"><button type="button" class="secondary" id="openSellerChat" style="width:100%;text-align:left;padding:11px 13px;font-size:13px;font-weight:650">✉　Чат с продавцом <span style="float:right">›</span></button></div>
 ${telegram()&&!p.phone?'<div class="profilebox" style="padding:10px 12px"><div style="font-size:12px;font-weight:700;margin-bottom:7px">Добавить номер из Telegram</div><button type="button" class="secondary" id="shareTelegramContact" style="width:100%;font-size:12px">Поделиться номером телефона</button><div class="notice" style="margin-bottom:0">Номер будет передан только после вашего разрешения.</div></div>':''}
 <div class="sectionhead"><h2>Мои заказы</h2></div><div id="myOrders"><div class="loading">Загрузка заказов…</div></div>
 <div class="profile-app-actions">
  <button type="button" id="installShopApp" class="profile-install-btn"><span class="profile-action-icon">↓</span><span>Установить приложение</span></button>
  <button type="button" id="shareReferral" class="profile-share-btn"><span class="profile-action-icon">↗</span><span>Поделиться магазином</span></button>

 </section>`;
}
function render(){
 const root=$('#root');if(location.pathname==='/admin'){renderAdmin(true);return}
 let content=state.view==='cart'?cartView():state.view==='checkout'?checkoutView():state.view==='profile'?profileView():state.view==='catalog'?catalogView():state.view==='category'?categoryView():state.view==='sale'?saleView():state.view==='product'?productDetailView():state.view==='specs'?productSpecsView():homeView();
 const cartEntries=(state.view==='cart'||state.view==='checkout')?Object.entries(state.cart).filter(([id,q])=>q>0&&state.selected.has(id)&&state.products.some(p=>String(p.id)===String(id))):[];const cartCheckout=cartEntries.length?(()=>{const qty=cartEntries.reduce((n,[,q])=>n+Number(q||0),0);const sum=cartEntries.reduce((n,[id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return n+(p?Number(p.price)*Number(q):0)},0);return `<div class="cart-checkout-dock"><button type="button" id="checkout" ${sum<=0?'disabled':''}><span>${state.view==='checkout'?'Подтвердить заказ · ':'Оформление заказа · '}${qty} шт.</span><b>${money(sum)}</b></button></div>`})():'';root.innerHTML=`<div class="app">${content}</div>${state.view==='product'?(()=>{const p=state.products.find(x=>String(x.id)===String(state.detailProductId));return p?`<div class="detail-buybar"><button type="button" data-add="${esc(p.id)}" ${Number(p.stock)<=0?'disabled':''}>В корзину</button></div>`:''})():''}${cartCheckout}${nav()}`;
 bindCommon();bindSaleCarousel();bindCardGalleries();bindProductDetail();
 if(window.hjSaleTimer){clearInterval(window.hjSaleTimer);window.hjSaleTimer=null}
 if(state.view==='home'&&discountedProducts().length>0)window.hjSaleTimer=setInterval(updateSaleBanner,4000);
 if(state.view==='profile'&&state.profileChatOpen){loadCustomerChat();if(window.hjChatRefresh)clearInterval(window.hjChatRefresh);window.hjChatRefresh=setInterval(()=>{if(state.view==='profile'&&state.profileChatOpen)loadCustomerChat()},5000)}
 else{if(window.hjChatRefresh){clearInterval(window.hjChatRefresh);window.hjChatRefresh=null}if(state.view==='profile'&&!state.profileEditing)loadMyOrders()}
}
function bindSaleCarousel(){const el=$('[data-sale-carousel]');if(!el)return;let startX=0;el.ontouchstart=e=>{startX=e.changedTouches[0].clientX};el.ontouchend=e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45){state.saleSlide=(state.saleSlide+(dx<0?1:3))%4;state.saleSwipeAt=Date.now();updateSaleBanner();e.preventDefault()}};el.onkeydown=e=>{if(e.key==='ArrowLeft'){state.saleSlide=(state.saleSlide+3)%4;updateSaleBanner()}if(e.key==='ArrowRight'){state.saleSlide=(state.saleSlide+1)%4;updateSaleBanner()}}}
function bindCommon(){
 const root=$('#root');
 root.onclick=async e=>{
  const cardDot=e.target.closest('[data-card-dot]');if(cardDot){const gallery=cardDot.closest('[data-card-gallery]');if(gallery)setCardPhoto(gallery,Number(cardDot.dataset.cardDot));return}
  if(e.target.closest('[data-detail-back]')){state.view=state.previousProductView||'home';render();return}
  if(e.target.closest('[data-open-specs]')){state.view='specs';render();window.scrollTo({top:0,behavior:'instant'});return}
  if(e.target.closest('[data-specs-back]')){state.view='product';render();return}
  const detailReviews=e.target.closest('[data-detail-reviews]');if(detailReviews){openReviews(detailReviews.dataset.detailReviews);return}
  if(Date.now()-state.saleSwipeAt<500&&e.target.closest('[data-open-sale]'))return;
  const saleDot=e.target.closest('[data-sale-dot]');if(saleDot){state.saleSlide=Number(saleDot.dataset.saleDot);updateSaleBanner();return}
  if(e.target.closest('[data-sale-prev]')){state.saleSlide=(state.saleSlide+3)%4;updateSaleBanner();return}
  if(e.target.closest('[data-sale-next]')){state.saleSlide=(state.saleSlide+1)%4;updateSaleBanner();return}
  const removePreview=e.target.closest('[data-remove-chat-photo]');if(removePreview){const input=$('#customerChatImage',root),dt=new DataTransfer(),files=Array.from(input.files||[]);files.forEach((file,i)=>{if(i!==Number(removePreview.dataset.removeChatPhoto))dt.items.add(file)});input.files=dt.files;renderChatPhotoPreview();return}const chatPhoto=e.target.closest('[data-chat-image]');if(chatPhoto){const viewer=document.createElement('div');viewer.className='chat-viewer';viewer.innerHTML='<button type="button" aria-label="Закрыть">×</button><img src="'+esc(chatPhoto.src)+'" alt="Фото">';viewer.onclick=()=>viewer.remove();document.body.appendChild(viewer);return}
  const sale=e.target.closest('[data-open-sale]');if(sale){state.view='sale';state.search='';render();window.scrollTo({top:0,behavior:'smooth'});return}const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;if(state.view==='profile')state.profileChatOpen=false;if(state.view==='home'){state.category='all';state.search='';}render();if(state.view==='profile')loadProfile();return}
  if(e.target.closest('#profileData')){state.profileEditing=true;state.profileChatOpen=false;render();return}
  if(e.target.closest('#shareReferral')){const code=state.profile?.referralCode;if(!code){toast('Ссылка ещё создаётся. Обновите профиль');return}const url=location.origin+'/r/'+encodeURIComponent(code);showShopShareOptions(url,'Посмотри магазин HJ Premium Market');return}
  if(e.target.closest('#shareTelegramContact')){const webApp=window.Telegram?.WebApp;if(webApp?.requestContact){webApp.requestContact(()=>{toast('Запрос отправлен. Обновляем профиль…');setTimeout(loadProfile,1600)})}else toast('Откройте магазин через Telegram, чтобы поделиться номером');return}
  if(e.target.closest('#openSellerChat')){state.customerChatOrderContext=null;state.profileChatOpen=true;state.profileEditing=false;render();return}
  if(e.target.closest('#chatBack')){state.profileChatOpen=false;state.customerChatOrderContext=null;render();return}
  if(e.target.closest('#profileBack')){state.profileEditing=false;render();return}
  const openCat=e.target.closest('[data-open-category]');if(openCat){state.category=openCat.dataset.openCategory;state.search='';state.view='category';render();return}
  const cat=e.target.closest('[data-cat]');if(cat){state.category=cat.dataset.cat;state.view='category';render();return}
  const add=e.target.closest('[data-add]');if(add){const p=state.products.find(x=>String(x.id)===String(add.dataset.add));if(!p)return;if(p.sizes?.length&&!state.selectedSizes[p.id]){toast('Сначала выберите размер кольца');return}changeQty(p.id,1);return}
  const plus=e.target.closest('[data-plus]');if(plus){changeQty(plus.dataset.plus,1);return}
  const minus=e.target.closest('[data-minus]');if(minus){changeQty(minus.dataset.minus,-1);return}
  const remove=e.target.closest('[data-remove]');if(remove){delete state.cart[remove.dataset.remove];state.selected.delete(remove.dataset.remove);saveCart();render();return}
  const open=e.target.closest('[data-open-product]');if(open&&!e.target.closest('[data-reviews]')){const gallery=open.closest('[data-card-gallery]');if(gallery&&Date.now()-Number(gallery.dataset.swipedAt||0)<450)return;openProduct(open.dataset.openProduct);return}
  const orderChat=e.target.closest('[data-chat-order]');if(orderChat){e.preventDefault();e.stopPropagation();openCustomerOrderChat(state.orders.find(o=>String(o.id)===String(orderChat.dataset.chatOrder)));return}
  const orderProduct=e.target.closest('[data-order-product]');if(orderProduct){openOrderedProduct(orderProduct.dataset.orderProduct);return}
  const reviews=e.target.closest('[data-reviews]');if(reviews){openReviews(reviews.dataset.reviews);return}
  if(e.target.closest('#searchBtn')){const input=$('#search');state.search=input?input.value.trim():state.search;state.view='home';render();return}
  if(e.target.closest('#checkoutBack')){state.view='cart';render();return}
  if(e.target.closest('#checkout')){checkout();return}
 };
 root.oninput=e=>{
  if(e.target.id!=='search')return;
  state.search=e.target.value;
  const list=filteredProducts();
  const grid=$('.products',root);if(grid)grid.innerHTML=list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">По вашему запросу ничего не найдено</div>';
  const count=$('.sectionhead .muted',root);if(count)count.textContent=list.length+' товаров';
 };
 root.onchange=e=>{
  const size=e.target.closest('[data-size]');if(size){state.selectedSizes[size.dataset.size]=size.value;saveCart();return}
  const select=e.target.closest('[data-select]');if(select){select.checked?state.selected.add(select.dataset.select):state.selected.delete(select.dataset.select);saveCart();render();return}
  if(e.target.id==='selectAll'){Object.keys(state.cart).forEach(id=>e.target.checked?state.selected.add(id):state.selected.delete(id));render()}
 };
 root.onsubmit=e=>{if(e.target.id==='profileForm')saveProfile(e);if(e.target.id==='customerChatForm')sendCustomerChat(e)};
 root.onchange=e=>{const size=e.target.closest('[data-size]');if(size){state.selectedSizes[size.dataset.size]=size.value;saveCart();return}const select=e.target.closest('[data-select]');if(select){select.checked?state.selected.add(select.dataset.select):state.selected.delete(select.dataset.select);saveCart();render();return}if(e.target.id==='selectAll'){Object.keys(state.cart).forEach(id=>e.target.checked?state.selected.add(id):state.selected.delete(id));saveCart();render();return}if(e.target.id==='customerChatImage')renderChatPhotoPreview()};
}
function filteredProducts(){const q=String(state.search||'').trim().toLocaleLowerCase('ru');const ordered=state.homeOrder.length?state.homeOrder.map(id=>state.products.find(p=>String(p.id)===String(id))).filter(Boolean):state.products;const selectedCategory=state.categories.find(c=>String(c.id)===String(state.category));const isSaleCategory=state.category!=='all'&&String(selectedCategory?.name||'').trim().toLocaleLowerCase('ru-RU')==='скидки';const saleIds=new Set(isSaleCategory?discountedProducts().map(p=>String(p.id)):[]);return ordered.filter(p=>(state.category==='all'||(isSaleCategory?saleIds.has(String(p.id)):String(p.categoryId)===String(state.category)))&&(!q||[p.name,p.desc,state.categories.find(c=>String(c.id)===String(p.categoryId))?.name].filter(Boolean).join(' ').toLocaleLowerCase('ru').includes(q)))}
async function loadProfile(){try{const data=await api('/api/profile',{},'customer');state.profile=data.profile||data;render()}catch(e){state.profile={};render();toast('Не удалось получить профиль с сервера: '+e.message)}}
async function saveProfile(e){e.preventDefault();const f=e.target;if(!f||f.id!=='profileForm')return;const fd=new FormData(f),value=n=>String(fd.get(n)||'').trim(),payload={firstName:value('firstName'),lastName:value('lastName'),middleName:value('middleName'),phone:value('phone'),gender:value('gender'),age:Number(value('age')),address:value('address')};if(!payload.firstName||!payload.phone||!payload.gender||!payload.address||!Number.isInteger(payload.age)||payload.age<1||payload.age>120){toast('Заполните имя, телефон, пол, возраст и адрес доставки');return}const file=f.elements.photoFile.files[0];if(file){if(file.size>4*1024*1024){toast('Фото должно быть меньше 4 МБ');return}try{payload.photo=await fileToData(file)}catch{toast('Не удалось прочитать фото');return}}try{state.profile=await api('/api/profile',{method:'PUT',body:JSON.stringify(payload)},'customer');state.profileEditing=false;toast('Данные сохранены');render()}catch(err){toast('Не удалось сохранить на сервере: '+err.message)}}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function renderChatPhotoPreview(){const input=$('#customerChatImage'),box=$('#customerChatPreview');if(!input||!box)return;const files=Array.from(input.files||[]);box.innerHTML=files.map((file,i)=>'<div class="wb-preview-item"><img src="'+URL.createObjectURL(file)+'" alt="Предпросмотр фото"><button type="button" data-remove-chat-photo="'+i+'" aria-label="Удалить фото">×</button></div>').join('');box.style.display=files.length?'flex':'none'}
 const selectedCustomer=new Set();let customerSelectMode=false;
 async function loadCustomerChat(){
  const box=$('#customerChatMessages');if(!box){if(window.hjCustomerTypingTimer){clearInterval(window.hjCustomerTypingTimer);window.hjCustomerTypingTimer=null}if(window.hjCustomerChatTimer){clearInterval(window.hjCustomerChatTimer);window.hjCustomerChatTimer=null}return}if(!window.hjCustomerChatTimer)window.hjCustomerChatTimer=setInterval(()=>{if($('#customerChatMessages'))loadCustomerChat();else{clearInterval(window.hjCustomerChatTimer);window.hjCustomerChatTimer=null}},5000);if(!window.hjCustomerTypingTimer)window.hjCustomerTypingTimer=setInterval(pollCustomerTyping,900);if(window.hjChatLoading)return;window.hjChatLoading=true;
  try{const data=await api('/api/chat',{},'customer'),messages=data.messages||[];const oldScrollTop=box.scrollTop;const wasReading=box.dataset.userReading==='1';const nearBottom=!wasReading&&box.scrollHeight-box.scrollTop-box.clientHeight<45;

   <label class="fieldlabel">Фотографии товара — можно удалить, заменить или добавить (до 10)</label>
   <div data-edit-photo-list style="display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px">${photoList(editPhotos)}</div>
   <label class="fieldlabel">Добавить фотографии товара</label><label for="editPhotos-${esc(p.id)}" class="secondary" style="display:block;text-align:center;padding:11px;border:1px dashed #aeb5c0;border-radius:10px;cursor:pointer">＋ Добавить фото</label><input id="editPhotos-${esc(p.id)}" style="display:none" name="photos" type="file" multiple accept="image/png,image/jpeg,image/webp">
   <label class="fieldlabel">Название товара *</label><input class="field" name="name" value="${esc(p.name)}" required>
   <label class="fieldlabel">Категория *</label><select class="field" name="categoryId">${categoryOptions(p.categoryId)}</select>
   <label class="fieldlabel">Описание товара</label><textarea class="field" name="desc" rows="3">${esc(p.desc||'')}</textarea>
   <label class="fieldlabel">Характеристики товара</label>${characteristicFieldsMarkup(p.characteristics||{})}\n   <div class="formgrid"><label><span class="fieldlabel">Цена за *</span><input class="field" name="price" type="number" min="0" step="0.01" value="${esc(p.price)}" required></label><label><span class="fieldlabel">Остаток *</span><input class="field" name="stock" type="number" min="0" step="1" value="${esc(p.stock)}" required></label></div>
   <button type="submit" class="primary dark" style="width:100%">Сохранить изменения</button></form>`;
  const form=box.querySelector('form'),photoContainer=form.querySelector('[data-edit-photo-list]');
  bindCharacteristicFields(form);
  let savingMainPhoto=false;
  const drawPhotos=()=>{photoContainer.innerHTML=editPhotos.map((src,i)=>`<div style="position:relative;flex:0 0 104px;width:104px;border:2px solid ${i===0?'#111827':'#e4e6eb'};border-radius:11px;padding:5px;background:#fff"><button type="button" data-main-photo="${i}" title="Сделать главной" style="display:block;width:100%;border:0;background:transparent;padding:0;cursor:pointer"><img src="${esc(src)}" alt="Фото товара ${i+1}" style="width:100%;height:78px;object-fit:contain;float:none"><small style="display:block;text-align:center;color:${i===0?'#111827':'#697180'};font-weight:${i===0?'800':'500'};padding:4px 0">${i===0?'✓ ГЛАВНАЯ':'Нажать — главная'}</small></button><button type="button" data-remove-photo="${i}" title="Удалить фото" style="position:absolute;right:-6px;top:-7px;border:0;border-radius:50%;background:#c93643;color:#fff;width:23px;height:23px;font-weight:900">×</button></div>`).join('');
   photoContainer.querySelectorAll('[data-main-photo]').forEach(x=>x.onclick=async()=>{const index=Number(x.dataset.mainPhoto);if(index===0||savingMainPhoto)return;const previous=[...editPhotos];editPhotos=[editPhotos[index],...editPhotos.filter((_,i)=>i!==index)];drawPhotos();savingMainPhoto=true;photoContainer.querySelectorAll('button').forEach(b=>b.disabled=true);try{const saved=await adminApi('/products/'+encodeURIComponent(p.id)+'/main-photo',{method:'PUT',body:JSON.stringify({photo:editPhotos[0]})});Object.assign(p,saved);editPhotos=[...p.photos];toast('Главное фото сохранено')}catch(err){editPhotos=previous;toast(err.message)}finally{savingMainPhoto=false;drawPhotos()}});
   photoContainer.querySelectorAll('[data-remove-photo]').forEach(x=>x.onclick=()=>{editPhotos.splice(Number(x.dataset.removePhoto),1);drawPhotos()})};
  drawPhotos();
  form.elements.photos.onchange=async e=>{const files=Array.from(e.target.files||[]);if(editPhotos.length+files.length>10){toast('Всего можно оставить не более 10 фото');e.target.value='';return}try{for(const file of files){if(file.size>4*1024*1024)throw Error('Каждое фото должно быть меньше 4 МБ');editPhotos.push(await fileToData(file))}drawPhotos();e.target.value=''}catch(err){toast(err.message)}};
  form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button[type="submit"]');if(!button)return;button.disabled=true;const originalLabel=button.textContent;button.textContent='Сохранение...';try{if(!editPhotos.length)throw Error('Оставьте хотя бы одно фото товара');const d=new FormData(form),payload={name:d.get('name'),desc:d.get('desc'),characteristics:collectCharacteristics(form),price:Number(d.get('price')),stock:Number(d.get('stock')),categoryId:d.get('categoryId'),photos:editPhotos,replacePhotos:true};const saved=await adminApi('/products/'+encodeURIComponent(p.id),{method:'PUT',body:JSON.stringify(payload)});if(!saved||String(saved.id)!==String(p.id))throw Error('Сервер не подтвердил сохранение товара');Object.assign(p,saved);toast('Изменения товара сохранены');await loadAdminTab()}catch(err){toast('Не удалось сохранить товар: '+err.message);button.disabled=false;button.textContent=originalLabel}}

 });
}else if(state.adminTab==='categories'){const d=await adminApi('/categories');const cats=Array.isArray(d)?d:(d.categories||[]);el.innerHTML=`<h2>Категории</h2><div class="adminitem"><form id="newCategory"><input class="field" name="name" required placeholder="Название новой категории"><button class="primary dark">Добавить категорию</button></form></div>${cats.map(c=>`<div class="adminitem"><div style="display:flex;gap:8px"><input class="field" data-catname="${esc(c.id)}" value="${esc(c.name)}"><button class="secondary" data-save-cat="${esc(c.id)}">Сохранить</button><button class="secondary danger" data-del-cat="${esc(c.id)}">×</button></div></div>`).join('')}`;$('#newCategory',el).onsubmit=async e=>{e.preventDefault();try{await adminApi('/categories',{method:'POST',body:JSON.stringify({name:new FormData(e.currentTarget).get('name')})});toast('Категория добавлена');loadAdminTab()}catch(e){toast(e.message)}};$$('[data-save-cat]',el).forEach(b=>b.onclick=async()=>{try{const id=b.dataset.saveCat,name=$(`[data-catname="${CSS.escape(id)}"]`,el).value;await adminApi('/categories/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({name})});toast('Категория сохранена')}catch(e){toast(e.message)}});$$('[data-del-cat]',el).forEach(b=>b.onclick=async()=>{if(!confirm('Удалить категорию?'))return;try{await adminApi('/categories/'+encodeURIComponent(b.dataset.delCat),{method:'DELETE'});toast('Категория удалена');loadAdminTab()}catch(e){toast(e.message)}})}else if(state.adminTab==='reviews'){const d=await adminApi('/reviews');const a=Array.isArray(d)?d:(d.reviews||[]);el.innerHTML=`<h2>Отзывы (${a.length})</h2>${a.length?a.map(r=>`<div class="adminitem"><div style="display:flex;gap:12px;align-items:flex-start">${r.productImage?`<img src="${esc(r.productImage)}" alt="${esc(r.productName||r.product||'Товар')}" style="width:100px;height:100px;object-fit:contain;background:#f6f6f6;border-radius:10px;float:none">`:'<div style="width:100px;height:100px;background:#f3f4f6;border-radius:10px;display:grid;place-items:center">Нет фото</div>'}<div style="flex:1;min-width:0"><h3 style="margin-top:0">${esc(r.productName||r.product||'Товар')}</h3><p><b>${esc(r.buyerName||r.name||'Покупатель')}</b> · ${'★'.repeat(Number(r.rating)||0)}${'☆'.repeat(5-Math.max(0,Math.min(5,Number(r.rating)||0)))}</p><p class="muted">${r.orderId?'Заказ №'+esc(r.orderId)+' · Подтверждённая покупка':'Старый отзыв без привязки к заказу'}</p><p class="muted">${esc(r.date||'')}</p></div></div>${r.productDesc?`<p><b>Описание товара:</b> ${esc(r.productDesc)}</p>`:''}${r.productPrice!=null?`<p><b>Цена при заказе:</b> ${money(r.productPrice)}</p>`:''}${(r.productPhotos||[]).length>1?`<div style="display:flex;gap:7px;overflow-x:auto;margin:8px 0">${r.productPhotos.map(src=>`<img src="${esc(src)}" style="width:68px;height:68px;object-fit:contain;background:#f6f6f6;border-radius:8px">`).join('')}</div>`:''}<p style="white-space:pre-wrap">${esc(r.text||'')}</p><button class="secondary danger" data-del-review="${esc(r.id)}">Удалить отзыв</button></div>`).join(''):'<div class="empty">Отзывов пока нет</div>'}`;$$('[data-del-review]',el).forEach(b=>b.onclick=async()=>{if(!confirm('Удалить отзыв?'))return;try{await adminApi('/reviews/'+encodeURIComponent(b.dataset.delReview),{method:'DELETE'});toast('Отзыв удалён');loadAdminTab()}catch(e){toast(e.message)}})}}catch(e){if(e.message.includes('401')||e.message.includes('403')){state.adminToken='';sessionStorage.removeItem('hj_admin_token');adminLogin()}else el.innerHTML=`<div class="empty">Ошибка: ${esc(e.message)}</div>`}}
function shuffleHomeProducts(){const ids=state.products.map(p=>String(p.id));for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}state.homeOrder=ids}
async function refreshHomeProducts(){if(state.refreshingHome||state.view!=='home'||location.pathname==='/admin')return;state.refreshingHome=true;toast('Обновляем товары…');try{await loadData();shuffleHomeProducts();state.category='all';render();window.scrollTo({top:0,behavior:'smooth'});toast('Товары обновлены — смотрите новинки!')}catch(e){toast('Не удалось обновить товары')}finally{state.refreshingHome=false}}
async function refreshCustomerPage(){if(state.refreshingHome||location.pathname==='/admin')return;state.refreshingHome=true;toast('Обновляем магазин…');try{await loadData();try{const data=await api('/api/cart',{},'customer');state.cart=data.items||{};state.selected=new Set(data.selected||Object.keys(state.cart));state.selectedSizes=data.sizes||{}}catch(e){console.error('Cart refresh:',e)}render();toast('Магазин обновлён')}catch(e){toast('Не удалось обновить магазин')}finally{state.refreshingHome=false}}
let pullStartY=0;let pullEligible=false;let adminPullEligible=false;let blockPagePull=false;let pullScrollParent=null;const getPullScrollParent=target=>{let node=target?.nodeType===1?target:target?.parentElement;while(node&&node!==document.body&&node!==document.documentElement){const style=getComputedStyle(node);if((/(auto|scroll)/).test(style.overflowY)&&node.scrollHeight>node.clientHeight+2)return node;node=node.parentElement}return null};window.addEventListener('touchstart',e=>{pullStartY=e.touches?.[0]?.clientY||0;pullScrollParent=getPullScrollParent(e.target);const atTop=pullScrollParent?pullScrollParent.scrollTop<=0:window.scrollY<=0;const oneFinger=e.touches?.length===1;const startedInChat=!!e.target.closest?.('.wb-chat-messages,.wb-admin-chat-messages');pullEligible=location.pathname!=='/admin'&&atTop&&oneFinger&&!startedInChat;adminPullEligible=location.pathname==='/admin'&&atTop&&oneFinger;blockPagePull=(pullEligible||adminPullEligible)&&atTop&&oneFinger},{passive:true});window.addEventListener('touchmove',e=>{const y=e.touches?.[0]?.clientY;if(y==null)return;const downward=y-pullStartY>0;const stillAtTop=pullScrollParent?pullScrollParent.scrollTop<=0:window.scrollY<=0;if(downward&&stillAtTop&&blockPagePull){e.preventDefault();return}if(!downward||!stillAtTop)blockPagePull=false},{passive:false});window.addEventListener('touchend',e=>{const endY=e.changedTouches?.[0]?.clientY||0;const distance=endY-pullStartY;if(pullEligible&&distance>85){pullEligible=false;refreshCustomerPage()}else pullEligible=false;if(adminPullEligible&&distance>85){adminPullEligible=false;toast('Обновляем админку…');setTimeout(()=>location.reload(),120)}else adminPullEligible=false;blockPagePull=false;pullScrollParent=null},{passive:true});
async function start(){if(window.Telegram?.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}if(location.pathname==='/admin'){renderAdmin(true);return}await loadData();try{await loadCart()}catch(e){state.cart={};state.selected.clear();state.selectedSizes={};toast('Не удалось загрузить личную корзину: '+e.message)}await loadProfile();shuffleHomeProducts();render()}
start();
})();
</script>

<style>
.pwa-install-banner{position:fixed;z-index:9;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));width:min(736px,calc(100% - 24px));margin:auto;display:flex;align-items:center;gap:10px;padding:11px 12px;background:#171d2b;color:#fff;border:1px solid #c69a4b;border-radius:14px;box-shadow:0 8px 28px #10182735}
.pwa-install-banner[hidden]{display:none!important}.pwa-install-copy{flex:1;min-width:0}.pwa-install-copy b{display:block;font-size:12px}.pwa-install-copy small{display:block;margin-top:2px;color:#d3d8e1;font-size:10px;line-height:1.3}.pwa-install-action{border:0;border-radius:9px;padding:9px 11px;background:#c69a4b;color:#171717;font-size:11px;font-weight:900;white-space:nowrap}.pwa-install-close{border:0;background:transparent;color:#dce1e9;font-size:20px;padding:0 3px}
</style>
<div id="pwa-install-banner" class="pwa-install-banner" hidden>
  <div class="pwa-install-copy"><b>Установить HJ PREMIUM MARKET</b><small id="pwa-install-hint">Добавьте магазин на главный экран телефона</small></div>
  <button id="pwa-install-action" class="pwa-install-action" type="button">Установить</button>
  <button id="pwa-install-close" class="pwa-install-close" type="button" aria-label="Закрыть">×</button>
</div>
<script>
(() => {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js', {scope:'/'}).catch(error => console.warn('PWA service worker:', error)));
  }
  const banner=document.getElementById('pwa-install-banner');
  const action=document.getElementById('pwa-install-action');
  const hint=document.getElementById('pwa-install-hint');
  const close=document.getElementById('pwa-install-close');
  if(!banner||!action||!hint||!close)return;

  const telegramApp=window.Telegram&&window.Telegram.WebApp;
  const inTelegram=Boolean((telegramApp&&telegramApp.initData)||/Telegram/i.test(navigator.userAgent)||new URLSearchParams(location.search).has('tgWebAppPlatform'));
  const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(navigator.userAgent);
  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const installed=()=>isStandalone()||localStorage.getItem('hj_pwa_installed')==='1';
  const params=new URLSearchParams(location.search);
  const cameFromTelegramInstall=params.get('pwa_install')==='1';
  let installPrompt=null;
  let autoAttempted=false;

  if(isStandalone())localStorage.setItem('hj_pwa_installed','1');

  function hideInstallControls(){
    banner.hidden=true;
    const profileButton=document.getElementById('installShopApp');
    if(profileButton)profileButton.hidden=true;
  }
  function show(message,label){
    if(installed()){hideInstallControls();return;}
    hint.textContent=message;
    action.textContent=label||'Установить';
    banner.hidden=false;
  }
  function cleanInstallParameter(){
    if(!params.has('pwa_install'))return;
    params.delete('pwa_install');
    const next=location.pathname+(params.toString()?'?'+params.toString():'')+location.hash;
    history.replaceState(history.state,'',next);
  }
  function openInBrowser(){
    const url=new URL(location.href);
    url.searchParams.set('pwa_install','1');
    url.searchParams.set('from_telegram','1');
    const target=url.toString();
    try{
      if(telegramApp&&typeof telegramApp.openLink==='function'){
        telegramApp.openLink(target,{try_instant_view:false});
        return;
      }
    }catch(error){console.warn('Telegram openLink failed:',error);}
    const link=document.createElement('a');
    link.href=target;link.target='_blank';link.rel='noopener noreferrer';
    link.style.display='none';document.body.appendChild(link);link.click();link.remove();
    hint.textContent='Если браузер не открылся, нажмите меню Telegram ⋮ и выберите «Открыть в браузере». Затем нажмите «Установить».',
    action.textContent='Открыть в браузере';
  }
  async function requestInstall(fromUser){
    if(installed()){hideInstallControls();return;}
    if(isIOS){
      alert('На iPhone откройте магазин в Safari. Нажмите «Поделиться» → «На экран Домой» → «Добавить».');
      return;
    }
    if(!installPrompt){
      show(isAndroid?'Если окно установки не появилось, откройте меню браузера (⋮) и выберите «Установить приложение» или «Добавить на главный экран».':'Откройте меню браузера и выберите «Установить приложение» или «Добавить на главный экран».','Установить');
      if(fromUser)alert(isAndroid?'Если системное окно не появилось, откройте меню браузера (⋮) и выберите «Установить приложение» или «Добавить на главный экран».':'Откройте меню браузера и выберите «Установить приложение» или «Добавить на главный экран».');
      return;
    }
    const promptEvent=installPrompt;
    try{
      const promptResult=promptEvent.prompt();
      installPrompt=null;
      window.hjInstallPrompt=null;
      await promptResult;
      const choice=await promptEvent.userChoice;
      if(choice&&choice.outcome==='accepted'){
        hint.textContent='Установка приложения началась…';
        action.textContent='Установка…';
        banner.hidden=true;
      }else{
        show('Установка не завершена. Нажмите «Установить» ещё раз, если браузер предлагает установку, или откройте меню браузера.','Установить');
      }
    }catch(error){
      installPrompt=promptEvent;
      window.hjInstallPrompt=promptEvent;
      show('Браузер не открыл установку автоматически. Нажмите «Установить» ещё раз.','Установить');
    }
  }

  if(installed())hideInstallControls();
  else if(inTelegram){
    show(isIOS?'Откройте магазин в Safari, чтобы добавить его на экран «Домой».':'Нажмите, чтобы открыть магазин во внешнем браузере и установить его на телефон.','Открыть в браузере');
    action.addEventListener('click',openInBrowser);
  }else if(isIOS){
    show('На iPhone: откройте магазин в Safari → «Поделиться» → «На экран Домой» → «Добавить».','Как установить');
    action.addEventListener('click',()=>requestInstall(true));
  }else{
    show('Установите HJ PREMIUM MARKET на главный экран телефона.','Установить');
    action.addEventListener('click',()=>requestInstall(true));
  }

  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    installPrompt=event;
    window.hjInstallPrompt=event;
    if(installed()){hideInstallControls();return;}
    if(!inTelegram){
      show('Нажмите «Установить», чтобы добавить магазин на главный экран телефона.','Установить');
      if(cameFromTelegramInstall&&!autoAttempted){
        autoAttempted=true;
        setTimeout(()=>requestInstall(false),250);
      }
    }
  });

  close.addEventListener('click',()=>{
    banner.hidden=true;
    sessionStorage.setItem('hj_pwa_banner_closed','1');
  });

  window.addEventListener('appinstalled',()=>{
    localStorage.setItem('hj_pwa_installed','1');
    installPrompt=null;
    window.hjInstallPrompt=null;
    hideInstallControls();
  });

  document.addEventListener('click',event=>{
    const button=event.target.closest('#installShopApp');
    if(!button)return;
    event.preventDefault();
    if(installed()){hideInstallControls();return;}
    if(inTelegram){openInBrowser();return;}
    requestInstall(true);
  });

  const observer=new MutationObserver(()=>{
    if(installed())hideInstallControls();
  });
  observer.observe(document.body,{childList:true,subtree:true});
  document.addEventListener('visibilitychange',()=>{if(installed())hideInstallControls();});
  cleanInstallParameter();
})();
</script>
