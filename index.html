<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>HJ PREMIUM MARKET</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#151923;--muted:#777f8d;--line:#e8eaf0;--accent:#171d2b;--gold:#c69a4b;--red:#e34c58;--green:#198754;--shadow:0 8px 26px #1720330c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:86px}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh}.top{background:linear-gradient(135deg,#101827,#293348);color:#fff;padding:22px 16px 18px;border-radius:0 0 24px 24px}.brandline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:900;letter-spacing:1.3px}.premium{font-size:10px;color:#e9c98d;letter-spacing:3px;margin-top:3px}.top p{color:#d4d8e0;margin:13px 0 0;font-size:13px}.searchbox{display:flex;gap:8px;margin-top:17px}.searchbox input{flex:1;min-width:0;border:0;border-radius:13px;padding:13px 14px;background:#fff;color:#111}.searchbox button,.primary{border:0;border-radius:12px;background:var(--gold);color:#171717;font-weight:800;padding:12px 16px}.section{padding:18px 14px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sectionhead h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:12px}.cats{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.cat{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;color:#343b49}.cat.active{background:#171d2b;color:#fff;border-color:#171d2b}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.product{background:#fff;border:1px solid #eef0f4;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);min-width:0}.photo{width:100%;padding:0;border:0;cursor:pointer;height:158px;background:linear-gradient(135deg,#e9eaf0,#f8f8fa);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#a0a5af;font-size:34px}.photo img{width:100%;height:100%;object-fit:cover}.pbody{padding:11px} .pname{font-weight:750;cursor:pointer;font-size:14px;line-height:1.3;min-height:36px}.desc{font-size:11px;color:var(--muted);margin:5px 0;min-height:29px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rating{font-size:11px;color:#9a742e;margin:6px 0}.price{font-size:17px;font-weight:900;margin:6px 0 9px}.stock{font-size:10px;color:var(--muted)}.addbtn{width:100%;border:0;border-radius:10px;background:#171d2b;color:#fff;padding:10px;font-weight:700}.qty{display:flex;align-items:center;justify-content:space-between;background:#f0f1f5;border-radius:10px;padding:4px}.qty button{width:34px;height:32px;border:0;border-radius:8px;background:#fff;font-size:20px}.qty span{font-weight:800}.empty{text-align:center;background:#fff;padding:30px 16px;border-radius:16px;color:var(--muted)}.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{border:0;background:transparent;color:#818896;padding:5px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav button b{font-size:20px;font-weight:500}.nav button.active{color:#151b29;font-weight:800}.count{background:var(--red);color:white;border-radius:20px;font-size:9px;padding:1px 5px;margin-left:3px}.panel{padding:18px 14px}.panel h2{margin:0 0 14px;font-size:20px}.cartrow{display:grid;grid-template-columns:20px 68px 1fr;gap:9px;align-items:center;background:#fff;padding:10px;border-radius:13px;margin-bottom:9px}.cartrow img{width:68px;height:68px;object-fit:cover;border-radius:9px}.cartname{font-weight:700;font-size:13px}.cartprice{font-weight:800;margin-top:4px}.cartcontrols{display:flex;align-items:center;gap:7px;margin-top:6px}.cartcontrols button{border:0;background:#f0f1f5;border-radius:7px;width:27px;height:26px}.totalbar{position:sticky;bottom:75px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:14px;box-shadow:var(--shadow)}.totalrow{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin-bottom:10px}.field{display:block;width:100%;border:1px solid #dfe2e9;border-radius:11px;padding:12px;background:#fff;margin:7px 0 12px;color:#171923}.fieldlabel{font-size:12px;font-weight:700;color:#515968}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{grid-column:1/-1}.profilebox,.orderbox,.adminbox,.reviewbox{background:#fff;border-radius:15px;padding:14px;margin-bottom:11px;border:1px solid var(--line)}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#eee}.notice{font-size:12px;color:var(--muted);margin:8px 0}.primary.dark{background:#171d2b;color:#fff}.danger{background:#fff0f1;color:#bf3542;border:1px solid #ffd6da}.secondary{background:#f0f1f5;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.modalback{position:fixed;inset:0;background:#11182799;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{background:#fff;border-radius:20px 20px 14px 14px;width:min(600px,100%);max-height:88vh;overflow:auto;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.close{border:0;background:#f0f1f5;border-radius:50%;width:34px;height:34px;font-size:19px}.stars button{border:0;background:none;font-size:27px;color:#d4d6dc;padding:2px}.stars button.on{color:#d6a64f}.hidden{display:none!important}.adminwrap{max-width:760px;margin:auto;padding:16px}.adminheader{background:#171d2b;color:white;border-radius:17px;padding:18px;margin-bottom:14px}.adminheader h1{font-size:20px;margin:0}.adminnav{display:flex;gap:7px;overflow:auto;margin:12px 0}.adminnav button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px}.adminnav button.active{background:#171d2b;color:#fff}.adminstats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#fff;border-radius:13px;padding:14px}.stat strong{font-size:22px;display:block}.adminitem{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}.adminitem h3{margin:0 0 5px;font-size:15px}.adminitem p{margin:4px 0;font-size:12px;color:#626a77}.adminitem .field{margin:7px 0}.adminitem img{width:58px;height:58px;object-fit:cover;border-radius:8px;float:right}.toast{position:fixed;z-index:50;bottom:90px;left:50%;transform:translateX(-50%);background:#171d2b;color:white;padding:11px 16px;border-radius:12px;max-width:90%;box-shadow:var(--shadow);font-size:13px}.loading{text-align:center;padding:35px;color:var(--muted)}
@media(min-width:600px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.photo{height:190px}.top{margin-top:14px}.bottom{border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<div id="root"><div class="loading">Загрузка магазина…</div></div>
<div id="toast" class="toast hidden"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const state={config:{currency:'сомони'},products:[],categories:[],cart:{},selected:new Set(),selectedSizes:{},view:'home',category:'all',search:'',profile:null,orders:[],reviews:[],adminToken:sessionStorage.getItem('hj_admin_token')||'',adminTab:'stats',adminData:{}};
try{const saved=JSON.parse(localStorage.getItem('hj_market_cart')||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))state.cart=saved}catch{}
function deviceId(){let v=localStorage.getItem('hj_device_id');if(!/^[a-f0-9]{32}$/.test(v||'')){const a=new Uint8Array(16);crypto.getRandomValues(a);v=Array.from(a,x=>x.toString(16).padStart(2,'0')).join('');localStorage.setItem('hj_device_id',v)}return v}
const telegram=()=>window.Telegram?.WebApp?.initData||'';
function headers(customer=false,admin=false){const h={};if(customer){h['x-device-id']=deviceId();if(telegram())h['x-tg-init-data']=telegram()}if(admin&&state.adminToken)h.Authorization='Bearer '+state.adminToken;return h}
async function api(url,opts={},kind='public'){const h={...headers(kind==='customer',kind==='admin'),...(opts.headers||{})};if(opts.body&&typeof opts.body==='string')h['Content-Type']='application/json';const res=await fetch(url,{...opts,headers:h});let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||data.message||('Ошибка '+res.status));return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('ru-RU').format(Number(v)||0)+' '+(state.config.currency||'сомони')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2800)}
function img(src,alt=''){return src?`<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`:'<span>✦</span>'}
function cartQty(id){return Number(state.cart[id]||0)}
function saveCart(){localStorage.setItem('hj_market_cart',JSON.stringify(state.cart))}
function changeQty(id,delta){const p=state.products.find(x=>String(x.id)===String(id));if(!p)return;const next=Math.max(0,Math.min(Number(p.stock),cartQty(id)+delta));if(next)state.cart[id]=next;else delete state.cart[id];saveCart();render()}
function cartCount(){return Object.values(state.cart).reduce((a,b)=>a+Number(b||0),0)}
function productCard(p){const q=cartQty(p.id);return `<article class="product"><button type="button" class="photo" data-open-product="${esc(p.id)}" aria-label="Открыть ${esc(p.name)}">${img(p.image,p.name)}</button><div class="pbody"><button type="button" class="pname" data-open-product="${esc(p.id)}" style="border:0;background:none;padding:0;text-align:left;width:100%">${esc(p.name)}</button><div class="desc">${esc(p.desc||'')}</div><div class="rating">★ ${Number(p.rating||0).toFixed(1)} · ${Number(p.reviews||0)} отзывов</div><div class="price">${money(p.price)}</div><div class="stock">${Number(p.stock)>0?'В наличии: '+p.stock:'Нет в наличии'}</div>${p.sizes?.length?`<label class="fieldlabel" style="display:block;margin-top:8px">Размер кольца</label><select class="field" data-size="${esc(p.id)}"><option value="">Выберите размер</option>${p.sizes.map(z=>`<option value="${esc(z)}" ${state.selectedSizes[p.id]===z?'selected':''}>${esc(z)}</option>`).join('')}</select>`:''}<div style="margin-top:9px">${q?`<div class="qty"><button data-minus="${esc(p.id)}">−</button><span>${q}</span><button data-plus="${esc(p.id)}">+</button></div>`:`<button class="addbtn" data-add="${esc(p.id)}" ${Number(p.stock)<=0?'disabled':''}>В корзину</button>`}</div><button class="secondary" style="width:100%;margin-top:7px;font-size:11px" data-reviews="${esc(p.id)}">Отзывы и оценка</button></div></article>`}
function nav(){return `<div class="bottom"><nav class="nav"><button data-view="home" class="${state.view==='home'?'active':''}"><b>⌕</b>Поиск</button><button data-view="catalog" class="${state.view==='catalog'?'active':''}"><b>▦</b>Каталог</button><button data-view="cart" class="${state.view==='cart'?'active':''}"><b>🛒</b>Корзина ${cartCount()?`<span class="count">${cartCount()}</span>`:''}</button><button data-view="profile" class="${state.view==='profile'?'active':''}"><b>♙</b>Профиль</button></nav></div>`}
function header(){return `<header class="top"><div class="brandline"><div><div class="brand">HJ PREMIUM MARKET</div><div class="premium">КАЧЕСТВО · СТИЛЬ · ПРЕМИУМ</div></div><div style="font-size:27px;color:#e8c78b">✦</div></div><p>Добро пожаловать! Выбирайте товары и оформляйте заказ онлайн.</p><div class="searchbox"><input id="search" placeholder="Найти товар…" value="${esc(state.search)}"><button id="searchBtn">Найти</button></div></header>`}
function categoryHtml(){return `<div class="section"><div class="sectionhead"><h2>Категории</h2></div><div class="cats"><button class="cat ${state.category==='all'?'active':''}" data-cat="all">Все товары</button>${state.categories.map(c=>`<button class="cat ${String(state.category)===String(c.id)?'active':''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div></div>`}
function homeView(){let list=filteredProducts();return `${header()}${categoryHtml()}<section class="section"><div class="sectionhead"><h2>${state.search?'Результаты поиска':'Популярные товары'}</h2><span class="muted">${list.length} товаров</span></div><div class="products">${list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">Товары не найдены</div>'}</div></section>`}
function cartView(){const entries=Object.entries(state.cart).filter(([id,q])=>q>0&&state.products.some(p=>String(p.id)===String(id)));if(!entries.length)return `<section class="panel"><h2>Корзина</h2><div class="empty">В корзине пока пусто.<br><button class="primary dark" style="margin-top:14px" data-view="catalog">Перейти в каталог</button></div></section>`;const total=entries.reduce((s,[id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return s+(p?Number(p.price)*q:0)},0);const selectedTotal=entries.reduce((s,[id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return s+(p&&state.selected.has(id)?Number(p.price)*q:0)},0);return `<section class="panel"><div class="sectionhead"><h2>Корзина</h2><label><input type="checkbox" id="selectAll" ${entries.every(([id])=>state.selected.has(id))?'checked':''}> Выбрать всё</label></div>${entries.map(([id,q])=>{const p=state.products.find(x=>String(x.id)===String(id));return `<div class="cartrow"><input type="checkbox" data-select="${esc(id)}" ${state.selected.has(id)?'checked':''}><div>${img(p.image,p.name)}</div><div><div class="cartname">${esc(p.name)}</div><div class="cartprice">${money(p.price* q)}</div><div class="cartcontrols"><button data-minus="${esc(id)}">−</button><b>${q}</b><button data-plus="${esc(id)}">+</button><button class="secondary" data-remove="${esc(id)}" style="margin-left:auto">Убрать</button></div></div></div>`}).join('')}<div class="totalbar"><div class="totalrow"><span>Выбрано к оплате</span><span>${money(selectedTotal)}</span></div><div class="notice">Всего в корзине: ${money(total)}. Неотмеченные товары останутся в корзине.</div><button class="primary dark" id="checkout" style="width:100%" ${selectedTotal<=0?'disabled':''}>Оформить выбранные товары</button></div></section>`}
function profileView(){const p=state.profile||{};return `<section class="panel"><h2>Профиль покупателя</h2><div class="profilebox"><div style="display:flex;align-items:center;gap:13px">${p.photo?`<img class="avatar" src="${esc(p.photo)}">`:'<div class="avatar" style="display:grid;place-items:center;font-size:30px">♙</div>'}<div><b>${esc([p.firstName,p.lastName].filter(Boolean).join(' ')||'Ваш профиль')}</b><div class="muted">Ваши данные нужны для оформления заказа</div></div></div><form id="profileForm"><div class="formgrid"><label class="wide"><span class="fieldlabel">Имя *</span><input class="field" name="firstName" required value="${esc(p.firstName||'')}" placeholder="Имя"></label><label><span class="fieldlabel">Фамилия</span><input class="field" name="lastName" value="${esc(p.lastName||'')}" placeholder="Фамилия"></label><label><span class="fieldlabel">Отчество</span><input class="field" name="middleName" value="${esc(p.middleName||'')}" placeholder="Отчество"></label><label class="wide"><span class="fieldlabel">Телефон *</span><input class="field" name="phone" required value="${esc(p.phone||'')}" placeholder="+992…" type="tel"></label><label class="wide"><span class="fieldlabel">Адрес доставки *</span><textarea class="field" name="address" required rows="2" placeholder="Город, улица, дом">${esc(p.address||'')}</textarea></label><label class="wide"><span class="fieldlabel">Фото профиля (необязательно)</span><input class="field" type="file" name="photoFile" accept="image/png,image/jpeg,image/webp"></label></div><button class="primary dark" style="width:100%">Сохранить профиль</button></form><p class="notice">Ваши телефон и адрес не показываются другим покупателям. Они доступны владельцу магазина только для обработки заказа.</p></div><div class="sectionhead"><h2>Мои заказы</h2></div><div id="myOrders"><div class="loading">Загрузка заказов…</div></div></section>`}
function render(){const root=$('#root');if(location.pathname==='/admin'){renderAdmin();return}let content=state.view==='cart'?cartView():state.view==='profile'?profileView():homeView();root.innerHTML=`<div class="app">${content}</div>${nav()}`;bindCommon();if(state.view==='profile')loadMyOrders()}
function bindCommon(){
 const root=$('#root');
 root.onclick=async e=>{
  const view=e.target.closest('[data-view]');if(view){state.view=view.dataset.view;render();if(state.view==='profile')loadProfile();return}
  const cat=e.target.closest('[data-cat]');if(cat){state.category=cat.dataset.cat;state.view='catalog';render();return}
  const add=e.target.closest('[data-add]');if(add){const p=state.products.find(x=>String(x.id)===String(add.dataset.add));if(!p)return;if(p.sizes?.length&&!state.selectedSizes[p.id]){toast('Сначала выберите размер кольца');return}changeQty(p.id,1);return}
  const plus=e.target.closest('[data-plus]');if(plus){changeQty(plus.dataset.plus,1);return}
  const minus=e.target.closest('[data-minus]');if(minus){changeQty(minus.dataset.minus,-1);return}
  const remove=e.target.closest('[data-remove]');if(remove){delete state.cart[remove.dataset.remove];state.selected.delete(remove.dataset.remove);saveCart();render();return}
  const open=e.target.closest('[data-open-product]');if(open){openProduct(open.dataset.openProduct);return}
  const reviews=e.target.closest('[data-reviews]');if(reviews){openReviews(reviews.dataset.reviews);return}
  if(e.target.closest('#searchBtn')){const input=$('#search');state.search=input?input.value.trim():state.search;state.view='home';render();return}
  if(e.target.closest('#checkout')){checkout();return}
 };
 root.oninput=e=>{
  if(e.target.id!=='search')return;
  state.search=e.target.value;
  const list=filteredProducts();
  const grid=$('.products',root);if(grid)grid.innerHTML=list.length?list.map(productCard).join(''):'<div class="empty" style="grid-column:1/-1">По вашему запросу ничего не найдено</div>';
  const count=$('.sectionhead .muted',root);if(count)count.textContent=list.length+' товаров';
 };
 root.onchange=e=>{
  const size=e.target.closest('[data-size]');if(size){state.selectedSizes[size.dataset.size]=size.value;return}
  const select=e.target.closest('[data-select]');if(select){select.checked?state.selected.add(select.dataset.select):state.selected.delete(select.dataset.select);render();return}
  if(e.target.id==='selectAll'){Object.keys(state.cart).forEach(id=>e.target.checked?state.selected.add(id):state.selected.delete(id));render()}
 };
 root.onsubmit=e=>{if(e.target.id==='profileForm')saveProfile(e)};
}
function filteredProducts(){const q=String(state.search||'').trim().toLocaleLowerCase('ru');return state.products.filter(p=>(state.category==='all'||String(p.categoryId)===String(state.category))&&(!q||[p.name,p.desc,state.categories.find(c=>String(c.id)===String(p.categoryId))?.name].filter(Boolean).join(' ').toLocaleLowerCase('ru').includes(q)))}
async function loadProfile(){try{const data=await api('/api/profile',{},'customer');state.profile=data.profile||data;render()}catch(e){if(e.message.includes('401')){state.profile={};render()}else toast(e.message)}}
async function saveProfile(e){e.preventDefault();const f=e.currentTarget,fd=new FormData(f),payload={firstName:fd.get('firstName').trim(),lastName:fd.get('lastName').trim(),middleName:fd.get('middleName').trim(),phone:fd.get('phone').trim(),address:fd.get('address').trim()};const file=f.elements.photoFile.files[0];if(file){if(file.size>4*1024*1024){toast('Фото должно быть меньше 4 МБ');return}try{payload.photo=await fileToData(file)}catch{toast('Не удалось прочитать фото');return}}try{state.profile=await api('/api/profile',{method:'PUT',body:JSON.stringify(payload)},'customer');toast('Профиль сохранён');render()}catch(err){toast(err.message)}}
function fileToData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
async function loadMyOrders(){const el=$('#myOrders');if(!el)return;try{const data=await api('/api/orders',{},'customer');const orders=Array.isArray(data)?data:(data.orders||[]);el.innerHTML=orders.length?orders.map(o=>`<div class="orderbox"><b>Заказ №${esc(o.orderNo||o.id)}</b><div class="muted">${esc(o.date||'')}</div><p>Статус: <b>${esc(o.status||'Новый')}</b></p><p>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join(', ')}</p><b>${money(o.total)}</b></div>`).join(''):'<div class="empty">У вас пока нет заказов</div>'}catch(e){el.innerHTML='<div class="notice">Не удалось загрузить заказы. Сначала сохраните профиль.</div>'}}
async function checkout(){const items=Object.entries(state.cart).filter(([id,q])=>state.selected.has(id)&&q>0).map(([id,qty])=>({id,qty,...(state.selectedSizes[id]?{size:state.selectedSizes[id]}:{})}));if(!items.length){toast('Выберите товары для заказа');return}try{let p=state.profile;if(!p)p=await api('/api/profile',{},'customer');if(!p.firstName||!p.phone||!p.address){state.view='profile';render();toast('Заполните имя, телефон и адрес');return}const result=await api('/api/orders',{method:'POST',body:JSON.stringify({items})},'customer');items.forEach(i=>{delete state.cart[i.id];state.selected.delete(i.id);delete state.selectedSizes[i.id]});saveCart();await loadData();state.view='profile';render();toast('Заказ оформлен! Номер: '+(result.orderNo||result.id||''))}catch(e){toast(e.message)}}
function openProduct(id){
 const p=state.products.find(x=>String(x.id)===String(id));if(!p)return;
 const modal=document.createElement('div');modal.className='modalback';
 modal.innerHTML=`<div class="modal" style="width:min(620px,100%);max-height:92vh"><div class="modalhead"><h3>О товаре</h3><button class="close" aria-label="Закрыть">×</button></div><div style="border-radius:14px;overflow:hidden;background:#f3f4f7;margin:12px 0"><img src="${esc(p.image||'')}" alt="${esc(p.name)}" style="width:100%;max-height:380px;object-fit:contain;display:block"></div><h2 style="margin:8px 0;font-size:21px">${esc(p.name)}</h2><div class="rating">★ ${Number(p.rating||0).toFixed(1)} · ${Number(p.reviews||0)} отзывов</div><div style="font-size:23px;font-weight:900;margin:10px 0">${money(p.price)}</div><p style="color:#626a77;line-height:1.55">${esc(p.desc||'Описание товара скоро появится.')}</p><p class="muted">${Number(p.stock)>0?'В наличии: '+p.stock+' шт.':'Нет в наличии'}</p>${p.sizes?.length?`<label class="fieldlabel">Выберите размер кольца</label><select class="field" id="detailSize"><option value="">Выберите размер</option>${p.sizes.map(z=>`<option value="${esc(z)}" ${state.selectedSizes[p.id]===z?'selected':''}>${esc(z)}</option>`).join('')}</select>`:''}<div class="actions"><button class="primary dark" id="detailAdd" ${Number(p.stock)<=0?'disabled':''}>Добавить в корзину</button><button class="secondary" id="detailReviews">Отзывы</button></div></div>`;
 document.body.append(modal);const close=()=>modal.remove();$('.close',modal).onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
 $('#detailAdd',modal).onclick=()=>{if(p.sizes?.length){const size=$('#detailSize',modal).value;if(!size){toast('Выберите размер кольца');return}state.selectedSizes[p.id]=size}changeQty(p.id,1);close();toast('Товар добавлен в корзину')};
 $('#detailReviews',modal).onclick=()=>{close();openReviews(p.id)};
}
async function openReviews(id){const p=state.products.find(x=>String(x.id)===String(id));if(!p)return;let reviews=[];try{const d=await api(`/api/products/${encodeURIComponent(id)}/reviews`);reviews=Array.isArray(d)?d:(d.reviews||[])}catch(e){toast(e.message);return}const modal=document.createElement('div');modal.className='modalback';modal.innerHTML=`<div class="modal"><div class="modalhead"><h3>Отзывы: ${esc(p.name)}</h3><button class="close" aria-label="Закрыть">×</button></div><div id="reviewList">${reviews.length?reviews.map(r=>`<div class="reviewbox"><b>${esc(r.name||'Покупатель')}</b><div class="rating">${'★'.repeat(Math.max(0,Math.min(5,Number(r.rating)||0)))}${'☆'.repeat(5-Math.max(0,Math.min(5,Number(r.rating)||0)))}</div><div>${esc(r.text||'')}</div><div class="muted">${esc(r.date||'')}</div></div>`).join(''):'<div class="empty">Пока нет отзывов</div>'}</div><hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><h3>Оставить отзыв</h3><form id="reviewForm"><div class="stars" id="stars">${[1,2,3,4,5].map(n=>`<button type="button" data-star="${n}" class="${n<=5?'on':''}">★</button>`).join('')}</div><textarea class="field" name="text" rows="3" maxlength="1000" placeholder="Ваш отзыв…"></textarea><button class="primary dark" style="width:100%">Отправить отзыв</button></form><p class="notice">Другие покупатели увидят только имя для отображения, оценку и текст отзыва. Телефон и адрес не публикуются.</p></div>`;document.body.append(modal);let rating=5;$$('[data-star]',modal).forEach(b=>b.onclick=()=>{rating=Number(b.dataset.star);$$('[data-star]',modal).forEach(x=>x.classList.toggle('on',Number(x.dataset.star)<=rating))});$('.close',modal).onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()};$('#reviewForm',modal).onsubmit=async e=>{e.preventDefault();try{await api(`/api/products/${encodeURIComponent(id)}/reviews`,{method:'POST',body:JSON.stringify({rating,text:new FormData(e.currentTarget).get('text')})},'customer');toast('Спасибо за отзыв!');modal.remove();await loadData();render()}catch(err){toast(err.message)}}}
async function loadData(){try{const [cfg,cats,products]=await Promise.all([api('/api/config'),api('/api/categories'),api('/api/products')]);state.config={...state.config,...cfg};state.categories=Array.isArray(cats)?cats:(cats.categories||[]);state.products=Array.isArray(products)?products:(products.products||[])}catch(e){console.error(e);toast('Не удалось загрузить магазин: '+e.message)}}
// Admin interface is served only at /admin; every admin API call is protected by the server token.
function adminLogin(){ $('#root').innerHTML=`<div class="adminwrap"><div class="adminheader"><h1>HJ PREMIUM MARKET</h1><div style="color:#d9c18e;font-size:11px;letter-spacing:2px">ПАНЕЛЬ ВЛАДЕЛЬЦА</div></div><div class="adminbox"><h2>Вход в админ-панель</h2><form id="adminLogin"><label class="fieldlabel">Пароль владельца</label><input class="field" name="password" type="password" required autocomplete="current-password" placeholder="Введите пароль"><button class="primary dark" style="width:100%">Войти</button></form><p class="notice">Покупательская часть магазина не содержит ссылки на эту панель.</p><a href="/" style="color:#555">← Открыть магазин</a></div></div>`;$('#adminLogin').onsubmit=async e=>{e.preventDefault();try{const password=new FormData(e.currentTarget).get('password');const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password})});state.adminToken=d.token;sessionStorage.setItem('hj_admin_token',d.token);renderAdmin()}catch(err){toast(err.message)}}}
function renderAdmin(){if(!state.adminToken){adminLogin();return}const tabs=[['stats','Обзор'],['orders','Заказы'],['products','Товары'],['categories','Категории'],['reviews','Отзывы']];$('#root').innerHTML=`<div class="adminwrap"><div class="adminheader"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>HJ PREMIUM MARKET</h1><div style="color:#d9c18e;font-size:11px;letter-spacing:2px">ПАНЕЛЬ ВЛАДЕЛЬЦА</div></div><button class="secondary" id="logout">Выйти</button></div></div><div class="adminnav">${tabs.map(([id,label])=>`<button data-atab="${id}" class="${state.adminTab===id?'active':''}">${label}</button>`).join('')}</div><div id="adminContent"><div class="loading">Загрузка…</div></div><p class="notice"><a href="/">← Перейти в магазин</a></p></div>`;$('#logout').onclick=()=>{state.adminToken='';sessionStorage.removeItem('hj_admin_token');adminLogin()};$$('[data-atab]').forEach(b=>b.onclick=()=>{state.adminTab=b.dataset.atab;renderAdmin()});loadAdminTab()}
async function adminApi(path,opts={}){return api('/api/admin'+path,opts,'admin')}
async function loadAdminTab(){const el=$('#adminContent');if(!el)return;try{if(state.adminTab==='stats'){const d=await adminApi('/stats');el.innerHTML=`<div class="adminstats">${[['Заказы',d.orders],['Товары',d.products],['Покупатели',d.customers],['Выручка',money(d.revenue||0)]].map(([n,v])=>`<div class="stat"><span class="muted">${n}</span><strong>${esc(v??0)}</strong></div>`).join('')}</div>`}else if(state.adminTab==='orders'){const d=await adminApi('/orders');const a=Array.isArray(d)?d:(d.orders||[]);el.innerHTML=`<h2>Заказы (${a.length})</h2>${a.length?a.map(o=>`<div class="adminitem"><h3>Заказ №${esc(o.orderNo||o.id)} · ${money(o.total)}</h3><p>${esc(o.date||'')}</p><p><b>Покупатель:</b> ${esc(o.name||'')}</p><p><b>Телефон:</b> ${esc(o.phone||'')}</p><p><b>Адрес:</b> ${esc(o.address||'')}</p><p><b>Товары:</b> ${(o.items||[]).map(i=>`${esc(i.name)} × ${i.qty}`).join(', ')}</p><label class="fieldlabel">Статус заказа</label><select class="field" data-status="${esc(o.id)}">${['Новый','Подтверждён','Собирается','Отправлен','Доставлен','Отменён'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="primary dark" data-save-status="${esc(o.id)}">Сохранить статус</button></div>`).join(''):'<div class="empty">Заказов пока нет</div>'}`;$$('[data-save-status]',el).forEach(b=>b.onclick=async()=>{const id=b.dataset.saveStatus,status=$(`[data-status="${CSS.escape(id)}"]`,el).value;try{await adminApi('/orders/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({status})});toast('Статус обновлён')}catch(e){toast(e.message)}})}else if(state.adminTab==='products'){const [pd,cd]=await Promise.all([adminApi('/products'),adminApi('/categories')]);const products=Array.isArray(pd)?pd:(pd.products||[]);const cats=Array.isArray(cd)?cd:(cd.categories||[]);el.innerHTML=`<h2>Товары</h2><div class="adminitem"><h3>Поиск и фильтр товаров</h3><input class="field" id="adminProductSearch" placeholder="Поиск по названию, описанию или категории…"><select class="field" id="adminProductCategory"><option value="all">Все категории</option>${cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></div><div class="adminitem"><h3>Добавить товар</h3><form id="newProduct"><input class="field" name="name" required placeholder="Название товара"><textarea class="field" name="desc" placeholder="Описание" rows="2"></textarea><div class="formgrid"><input class="field" name="price" type="number" min="0" step="0.01" required placeholder="Цена"><input class="field" name="stock" type="number" min="0" required placeholder="Количество"></div><select class="field" name="categoryId" required>${cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select><label class="fieldlabel">Фото товара (до 4 МБ)</label><input class="field" name="photo" type="file" accept="image/png,image/jpeg,image/webp"><button class="primary dark" style="width:100%">Добавить товар</button></form></div>${products.map(p=>{const category=cats.find(c=>String(c.id)===String(p.categoryId))?.name||"Без категории";return `<div class="adminitem" data-admin-card data-category="${esc(p.categoryId)}" data-search="${esc((p.name||"")+" "+(p.desc||"")+" "+category)}">${p.image?`<img src="${esc(p.image)}">`: ""}<h3>${esc(p.name)}</h3><p><b>Категория:</b> ${esc(category)}</p><p>${money(p.price)} · Остаток: ${esc(p.stock)}</p><p>${esc(p.desc||"")}</p><div class="actions"><button class="secondary" data-edit-product="${esc(p.id)}">Изменить</button><button class="secondary danger" data-delete-product="${esc(p.id)}">Удалить</button></div><div id="edit-${esc(p.id)}"></div></div>`}).join("")}`;const filterAdminProducts=()=>{const q=($('#adminProductSearch',el)?.value||'').trim().toLowerCase();const cat=$('#adminProductCategory',el)?.value||'all';$('[data-admin-card]',el).forEach(card=>{const okText=(card.dataset.search||'').toLowerCase().includes(q);const okCat=cat==='all'||String(card.dataset.category)===String(cat);card.classList.toggle('hidden',!(okText&&okCat))})};$('#adminProductSearch',el).oninput=filterAdminProducts;$('#adminProductCategory',el).onchange=filterAdminProducts;$('#newProduct',el).onsubmit=async e=>{e.preventDefault();try{const f=e.currentTarget,d=new FormData(f),payload={name:d.get('name'),desc:d.get('desc'),price:Number(d.get('price')),stock:Number(d.get('stock')),categoryId:d.get('categoryId')};const file=f.elements.photo.files[0];if(file){if(file.size>4*1024*1024)throw Error('Фото должно быть меньше 4 МБ');payload.photo=await fileToData(file)}await adminApi('/products',{method:'POST',body:JSON.stringify(payload)});toast('Товар добавлен');loadAdminTab()}catch(e){toast(e.message)}};$$('[data-delete-product]',el).forEach(b=>b.onclick=async()=>{if(!confirm('Удалить этот товар?'))return;try{await adminApi('/products/'+encodeURIComponent(b.dataset.deleteProduct),{method:'DELETE'});toast('Товар удалён');loadAdminTab()}catch(e){toast(e.message)}});$$('[data-edit-product]',el).forEach(b=>b.onclick=()=>{const p=products.find(x=>String(x.id)===b.dataset.editProduct),box=$('#edit-'+CSS.escape(p.id),el);box.innerHTML=`<form data-edit-form="${esc(p.id)}"><input class="field" name="name" value="${esc(p.name)}" required><textarea class="field" name="desc">${esc(p.desc||'')}</textarea><div class="formgrid"><input class="field" name="price" type="number" min="0" step="0.01" value="${esc(p.price)}"><input class="field" name="stock" type="number" min="0" value="${esc(p.stock)}"></div><select class="field" name="categoryId">${cats.map(c=>`<option value="${esc(c.id)}" ${c.id===p.categoryId?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input class="field" name="photo" type="file" accept="image/png,image/jpeg,image/webp"><button class="primary dark">Сохранить изменения</button></form>`;box.querySelector('form').onsubmit=async e=>{e.preventDefault();try{const f=e.currentTarget,d=new FormData(f),payload={name:d.get('name'),desc:d.get('desc'),price:Number(d.get('price')),stock:Number(d.get('stock')),categoryId:d.get('categoryId')};const file=f.elements.photo.files[0];if(file){if(file.size>4*1024*1024)throw Error('Фото должно быть меньше 4 МБ');payload.photo=await fileToData(file)}await adminApi('/products/'+encodeURIComponent(p.id),{method:'PUT',body:JSON.stringify(payload)});toast('Изменения сохранены');loadAdminTab()}catch(err){toast(err.message)}}})}else if(state.adminTab==='categories'){const d=await adminApi('/categories');const cats=Array.isArray(d)?d:(d.categories||[]);el.innerHTML=`<h2>Категории</h2><div class="adminitem"><form id="newCategory"><input class="field" name="name" required placeholder="Название новой категории"><button class="primary dark">Добавить категорию</button></form></div>${cats.map(c=>`<div class="adminitem"><div style="display:flex;gap:8px"><input class="field" data-catname="${esc(c.id)}" value="${esc(c.name)}"><button class="secondary" data-save-cat="${esc(c.id)}">Сохранить</button><button class="secondary danger" data-del-cat="${esc(c.id)}">×</button></div></div>`).join('')}`;$('#newCategory',el).onsubmit=async e=>{e.preventDefault();try{await adminApi('/categories',{method:'POST',body:JSON.stringify({name:new FormData(e.currentTarget).get('name')})});toast('Категория добавлена');loadAdminTab()}catch(e){toast(e.message)}};$$('[data-save-cat]',el).forEach(b=>b.onclick=async()=>{try{const id=b.dataset.saveCat,name=$(`[data-catname="${CSS.escape(id)}"]`,el).value;await adminApi('/categories/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({name})});toast('Категория сохранена')}catch(e){toast(e.message)}});$$('[data-del-cat]',el).forEach(b=>b.onclick=async()=>{if(!confirm('Удалить категорию?'))return;try{await adminApi('/categories/'+encodeURIComponent(b.dataset.delCat),{method:'DELETE'});toast('Категория удалена');loadAdminTab()}catch(e){toast(e.message)}})}else if(state.adminTab==='reviews'){const d=await adminApi('/reviews');const a=Array.isArray(d)?d:(d.reviews||[]);el.innerHTML=`<h2>Отзывы (${a.length})</h2>${a.length?a.map(r=>`<div class="adminitem"><h3>${esc(r.productName||r.product||'Товар')}</h3><p><b>${esc(r.name||'Покупатель')}</b> · ${'★'.repeat(Number(r.rating)||0)}</p><p>${esc(r.text||'')}</p><p>${esc(r.date||'')}</p><button class="secondary danger" data-del-review="${esc(r.id)}">Удалить отзыв</button></div>`).join(''):'<div class="empty">Отзывов пока нет</div>'}`;$$('[data-del-review]',el).forEach(b=>b.onclick=async()=>{if(!confirm('Удалить отзыв?'))return;try{await adminApi('/reviews/'+encodeURIComponent(b.dataset.delReview),{method:'DELETE'});toast('Отзыв удалён');loadAdminTab()}catch(e){toast(e.message)}})}}catch(e){if(e.message.includes('401')||e.message.includes('403')){state.adminToken='';sessionStorage.removeItem('hj_admin_token');adminLogin()}else el.innerHTML=`<div class="empty">Ошибка: ${esc(e.message)}</div>`}}
async function start(){if(window.Telegram?.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}try{const saved=JSON.parse(localStorage.getItem('hj_market_cart')||'{}');if(saved&&typeof saved==='object')state.cart=saved}catch{}if(location.pathname==='/admin'){renderAdmin();return}await loadData();render()}
start();
})();
</script>
</body></html>
